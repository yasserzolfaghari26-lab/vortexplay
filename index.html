<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEXPLAY | دنیای بازی‌ها</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        :root {
            --neon-orange: #ff6b00;
            --neon-blue: #00d4ff;
            --neon-purple: #a800ff;
            --dark-bg: #050508;
            --card-bg: #0f0f1a;
        }

        body {
            background: var(--dark-bg);
            color: white;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255,107,0,0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0,212,255,0.08) 0%, transparent 40%);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        header {
            text-align: center;
            padding: 40px 0 50px;
        }

        .logo {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-orange), var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(255,107,0,0.3);
            letter-spacing: 2px;
            margin-bottom: 10px;
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 8px rgba(255,107,0,0.4)); }
            to { filter: drop-shadow(0 0 20px rgba(0,212,255,0.6)); }
        }

        .subtitle {
            color: #889;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .neon-line {
            height: 3px;
            background: linear-gradient(90deg, var(--neon-orange), var(--neon-blue), var(--neon-purple));
            border-radius: 2px;
            margin: 20px auto;
            width: 200px;
            box-shadow: 0 0 15px rgba(255,107,0,0.5);
        }

        .section-title {
            font-size: 1.4rem;
            margin: 40px 0 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--neon-blue);
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,107,0,0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-orange);
            box-shadow: 0 0 25px rgba(255,107,0,0.3), inset 0 0 15px rgba(255,107,0,0.1);
        }

        .game-card h3 {
            font-size: 1.2rem;
            margin-bottom: 5px;
            color: #fff;
        }

        .game-card p {
            color: #889;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .download-btn {
            display: inline-block;
            padding: 10px 25px;
            background: linear-gradient(135deg, var(--neon-orange), #ff8c00);
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(255,107,0,0.4);
        }

        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255,107,0,0.7);
        }

        .admin-link {
            text-align: center;
            margin-top: 50px;
        }

        .admin-btn {
            display: inline-block;
            padding: 12px 30px;
            background: transparent;
            border: 2px solid var(--neon-purple);
            color: var(--neon-purple);
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }

        .admin-btn:hover {
            background: var(--neon-purple);
            color: white;
            box-shadow: 0 0 20px rgba(168,0,255,0.5);
        }

        footer {
            text-align: center;
            margin-top: 60px;
            padding: 20px;
            color: #555;
            font-size: 0.85rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        /* صفحه مدیریت */
        .panel-container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(0,212,255,0.2);
            box-shadow: 0 0 30px rgba(0,212,255,0.1);
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0,212,255,0.3);
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-orange), #ff8c00);
            color: white;
            box-shadow: 0 0 10px rgba(255,107,0,0.4);
        }

        .btn-primary:hover {
            box-shadow: 0 0 20px rgba(255,107,0,0.7);
        }

        .back-link {
            color: var(--neon-blue);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
        }

        .success-msg {
            color: #00ff88;
            margin-top: 10px;
        }

        .error-msg {
            color: #ff4466;
            margin-top: 10px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container" id="main-page">
        <header>
            <h1 class="logo">VORTEXPLAY</h1>
            <p class="subtitle">مرکز دانلود بازی‌ها و محتوای گیمینگ</p>
            <div class="neon-line"></div>
        </header>

        <h2 class="section-title">🎮 بازی‌ها و محتوا</h2>
        <div id="games-list">
            <!-- کارت‌های اینجا اضافه میشن -->
            <div class="game-card">
                <h3>بازی شماره یک</h3>
                <p>توضیحات و مشخصات بازی</p>
                <a href="#" class="download-btn">دانلود 📥</a>
            </div>
        </div>

        <div class="admin-link">
            <a href="javascript:showAdmin()" class="admin-btn">🔐 پنل مدیریت</a>
        </div>

        <footer>
            <p>© ۲۰۲۶ VORTEXPLAY | طراحی شده با عشق و نئون 💜</p>
        </footer>
    </div>

    <!-- صفحه مدیریت -->
    <div class="container hidden" id="admin-page">
        <a href="javascript:showMain()" class="back-link">← بازگشت به سایت</a>
        
        <div id="login-box" class="panel-container">
            <h2>🔐 ورود به پنل مدیریت</h2>
            <input type="password" id="admin-pass" placeholder="رمز ۳۲ رقمی را وارد کنید...">
            <button class="btn btn-primary" onclick="checkPassword()">ورود</button>
            <p id="login-error" class="error-msg"></p>
        </div>

        <div id="admin-panel" class="panel-container hidden">
            <h2>✅ خوش اومدی!</h2>
            <hr style="border-color: rgba(255,255,255,0.1); margin: 20px 0;">

            <h3>➕ اضافه کردن لینک جدید</h3>
            <input type="text" id="game-name" placeholder="نام بازی / محتوا">
            <textarea id="game-desc" placeholder="توضیحات کوتاه..."></textarea>
            <input type="url" id="game-link" placeholder="لینک دانلود (مثل: https://... )">
            <button class="btn btn-primary" onclick="addGame()">انتشار لینک</button>
            <p id="add-status" class="success-msg"></p>

            <hr style="border-color: rgba(255,255,255,0.1); margin: 25px 0;">

            <h3>🎨 تغییر ظاهر</h3>
            <input type="text" id="new-logo-text" placeholder="متن لوگو (مثال: VORTEXPLAY)">
            <button class="btn btn-primary" onclick="changeLogoText()">تغییر نام</button>

            <hr style="border-color: rgba(255,255,255,0.1); margin: 25px 0;">

            <h3>🔑 تغییر رمز</h3>
            <input type="password" id="old-pass" placeholder="رمز فعلی">
            <input type="password" id="new-pass" placeholder="رمز جدید ۳۲ رقمی">
            <button class="btn btn-primary" onclick="changeAdminPass()">تغییر رمز</button>
            <p id="pass-status" class="success-msg"></p>
        </div>
    </div>

    <script>
        let ADMIN_PASSWORD = "VORTEX9X7K2P4R8M3N5L6J1H9G8F7D6S5A4D3B";

        function loadGames() {
            const saved = localStorage.getItem('vortex_games');
            const games = saved ? JSON.parse(saved) : [
                {name: 'بازی شماره یک', desc: 'توضیحات و مشخصات بازی', link: '#'}
            ];
            renderGames(games);
        }

        function renderGames(games) {
            const list = document.getElementById('games-list');
            list.innerHTML = '';
            games.forEach((g, i) => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <h3>${g.name}</h3>
                    <p>${g.desc}</p>
                    <a href="${g.link}" target="_blank" class="download-btn">دانلود 📥</a>
                `;
                list.appendChild(card);
            });
        }

        function addGame() {
            const name = document.getElementById('game-name').value.trim();
            const desc = document.getElementById('game-desc').value.trim();
            const link = document.getElementById('game-link').value.trim();
            
            if(!name || !link) return alert('نام و لینک را وارد کن!');
            
            const saved = localStorage.getItem('vortex_games');
            const games = saved ? JSON.parse(saved) : [];
            games.unshift({name, desc, link});
            localStorage.setItem('vortex_games', JSON.stringify(games));
            
            renderGames(games);
            document.getElementById('game-name').value = '';
            document.getElementById('game-desc').value = '';
            document.getElementById('game-link').value = '';
            
            document.getElementById('add-status').textContent = '✅ لینک اضافه شد!';
            setTimeout(() => document.getElementById('add-status').textContent = '', 3000);
        }

        function showAdmin() {
            document.getElementById('main-page').classList.add('hidden');
            document.getElementById('admin-page').classList.remove('hidden');
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('login-box').classList.remove('hidden');
        }

        function showMain() {
            document.getElementById('admin-page').classList.add('hidden');
            document.getElementById('main-page').classList.remove('hidden');
            document.getElementById('admin-pass').value = '';
        }

        function checkPassword() {
            const input = document.getElementById('admin-pass').value.trim();
            if(input === ADMIN_PASSWORD) {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                document.getElementById('login-error').textContent = '';
            } else {
                document.getElementById('login-error').textContent = '❌ رمز اشتباه!';
            }
        }

        function changeLogoText() {
            const text = document.getElementById('new-logo-text').value.trim();
            if(!text) return;
            document.querySelector('.logo').textContent = text;
            alert('✅ نام تغییر کرد!');
        }

        function changeAdminPass() {
            const oldP = document.getElementById('old-pass').value.trim();
            const newP = document.getElementById('new-pass').value.trim();
            
            if(oldP !== ADMIN_PASSWORD) return alert('❌ رمز فعلی اشتباه!');
            if(newP.length < 32) return alert('❌ باید ۳۲ کاراکتر باشد!');
            
            ADMIN_PASSWORD = newP;
            alert('✅ رمز عوض شد!');
            document.getElementById('old-pass').value = '';
            document.getElementById('new-pass').value = '';
        }

        loadGames();
    </script>
</body>
</html>
