<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEXPLAY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', sans-serif;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, #020617 0%, #111827 50%, #0f172a 100%);
        }

        /* === پس‌زمینه‌های متحرک === */
        .bg-layer-1 {
            position: absolute;
            top: -30%;
            right: -10%;
            width: 70%;
            height: 80%;
            background: radial-gradient(ellipse at center, rgba(255, 120, 0, 0.25) 0%, transparent 60%);
            filter: blur(60px);
            animation: float1 8s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .bg-layer-2 {
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 70%;
            height: 80%;
            background: radial-gradient(ellipse at center, rgba(0, 150, 255, 0.25) 0%, transparent 60%);
            filter: blur(60px);
            animation: float2 10s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .bg-layer-3 {
            position: absolute;
            top: 20%;
            left: 15%;
            width: 70%;
            height: 50%;
            background: radial-gradient(ellipse at center, rgba(139, 92, 246, 0.15) 0%, transparent 60%);
            filter: blur(50px);
            animation: float3 12s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes float1 {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(-40px, 30px) scale(1.1); }
        }
        @keyframes float2 {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(40px, -30px) scale(1.15); }
        }
        @keyframes float3 {
            from { transform: translate(0, 0); }
            to { transform: translate(20px, 20px); }
        }

        /* === ذرات نور === */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            animation: twinkle 3s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* === کانتینر اصلی === */
        .main-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* === لوگو مرکزی === */
        .logo-wrapper {
            position: relative;
            margin-bottom: 30px;
        }

        .logo-glow-ring {
            position: absolute;
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff9500, #0099ff, #8b5cf6, #ff9500);
            background-size: 400% 400%;
            animation: rotateGlow 6s linear infinite;
            z-index: 1;
            filter: blur(8px);
            opacity: 0.7;
        }
        @keyframes rotateGlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 400% 50%; }
        }

        .logo-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
            border: 3px solid transparent;
            background-clip: padding-box;
        }

        .logo-text {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700, #ff8c00, #00d9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }

        /* === عنوان === */
        .site-title {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 30px rgba(0, 217, 255, 0.5);
            margin-bottom: 8px;
            text-align: center;
        }

        .site-subtitle {
            font-size: 1rem;
            letter-spacing: 6px;
            color: #60a5fa;
            text-transform: uppercase;
            margin-bottom: 35px;
        }

        /* === نوار وضعیت === */
        .status-badge {
            padding: 12px 35px;
            background: rgba(0, 255, 136, 0.08);
            border: 1px solid rgba(0, 255, 136, 0.4);
            border-radius: 50px;
            color: #00ff88;
            font-weight: 700;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 45px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.15);
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.4); }
        }

        /* === کارت‌های دسته‌بندی === */
        .cards-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 420px;
        }

        .cat-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(96, 165, 250, 0.2);
            border-radius: 16px;
            padding: 22px 25px;
            display: flex;
            align-items: center;
            gap: 18px;
            transition: all 0.35s ease;
            backdrop-filter: blur(12px);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .cat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #ff9500, #ffd700);
            border-radius: 4px 0 0 4px;
        }

        .cat-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: rgba(0, 217, 255, 0.5);
            box-shadow: 0 15px 40px rgba(0, 150, 255, 0.15);
            background: rgba(1, 21, 45, 0.85);
        }

        .cat-icon-box {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(0, 150, 255, 0.2), rgba(139, 92, 246, 0.2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #00d9ff;
            flex-shrink: 0;
        }

        .cat-info h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 3px;
        }

        .cat-info p {
            font-size: 0.8rem;
            color: #94a3b8;
            margin: 0;
        }

        /* === دکمه مدیریت === */
        .admin-link {
            margin-top: 40px;
            padding: 12px 30px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.35);
            border-radius: 50px;
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.3s;
            backdrop-filter: blur(8px);
        }

        .admin-link:hover {
            background: rgba(139, 92, 246, 0.2);
            border-color: #a78bfa;
            color: #e9d5ff;
        }

        /* === پایین صفحه === */
        .footer-note {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #475569;
        }
    </style>
</head>
<body>
    <!-- لایه‌های پس‌زمینه -->
    <div class="bg-layer-1"></div>
    <div class="bg-layer-2"></div>
    <div class="bg-layer-3"></div>

    <!-- ذرات نور -->
    <script>
        // ساخت ذرات متحرک
        const particleCount = 25;
        for (let i = 0; i < particleCount; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 3 + 1;
            p.style.width = p.style.height = size + 'px';
            p.style.left = Math.random() * 100 + '%';
            p.style.top = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 3 + 's';
            document.body.appendChild(p);
        }
    </script>

    <!-- محتوای اصلی -->
    <div class="main-container">
        <div class="logo-wrapper">
            <div class="logo-glow-ring"></div>
            <div class="logo-circle">
                <span class="logo-text">VP</span>
            </div>
        </div>

        <h1 class="site-title">VORTEXPLAY</h1>
        <p class="site-subtitle">◆ GAMING EMPIRE ◆</p>

        <div class="status-badge">
            <span class="status-dot"></span>
            SYSTEM STATUS: ONLINE
        </div>

        <div class="cards-grid">
            <div class="cat-card">
                <div class="cat-icon-box">
                    <i class="fas fa-book"></i>
                </div>
                <div class="cat-info">
                    <h3>BACKUP & TUTORIALS</h3>
                    <p>Guides & System Files</p>
                </div>
            </div>

            <div class="cat-card">
                <div class="cat-icon-box">
                    <i class="fas fa-gamepad"></i>
                </div>
                <div class="cat-info">
                    <h3>PS5 GAME</h3>
                    <p>PlayStation 5 Games & PKGs</p>
                </div>
            </div>

            <div class="cat-card">
                <div class="cat-icon-box">
                    <i class="fas fa-images"></i>
                </div>
                <div class="cat-info">
                    <h3>GAME PHOTOS</h3>
                    <p>Wallpapers & Screenshots</p>
                </div>
            </div>
        </div>

        <a href="#" class="admin-link">
            <i class="fas fa-cog me-2"></i>ورود به پنل مدیریت
        </a>

        <p class="footer-note">VORTEXPLAY © 2026 — All Rights Reserved</p>
    </div>
</body>
</html>
