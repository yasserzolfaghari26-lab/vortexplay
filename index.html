<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">VORTEXPLAY - Gaming Empire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #05070c 0%, #0b0f19 50%, #11081f 100%);
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .main-container {
            width: 100%;
            max-width: 450px;
            text-align: center;
            padding-bottom: 40px;
        }
        .logo-box {
            width: 120px;
            height: 120px;
            margin: 20px auto 10px auto;
            border-radius: 50%;
            border: 3px solid #00f0ff;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
            overflow: hidden;
            background: #000;
        }
        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 5px;
            font-size: 1.8rem;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        .subtitle {
            color: #00f0ff;
            font-size: 0.85rem;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        .status-badge {
            border: 2px solid #00f0ff;
            border-radius: 30px;
            padding: 8px 20px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #ffffff;
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            display: inline-block;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        .category-card {
            background: rgba(17, 24, 39, 0.85);
            border: 2px solid #00f0ff;
            border-radius: 14px;
            padding: 15px 20px;
            margin-bottom: 15px;
            text-align: right;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
            transition: all 0.3s ease;
            cursor: pointer;
            display: block;
            text-decoration: none;
        }
        .category-card:hover {
            border-color: #facc15;
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.4);
            transform: translateY(-2px);
        }
        .category-title {
            color: #00f0ff;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 3px;
        }
        .category-desc {
            color: #9ca3af;
            font-size: 0.8rem;
            margin: 0;
        }
        .msg-card {
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid #00f0ff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
            word-break: break-word;
            text-align: right;
        }
        .msg-date {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: 8px;
            text-align: left;
        }
        .btn-custom {
            border: 1px dashed #00f0ff;
            background: rgba(0, 0, 0, 0.5);
            color: #00f0ff;
            padding: 8px 25px;
            border-radius: 20px;
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-custom:hover {
            background: #00f0ff;
            color: #000;
        }
        .admin-panel-box {
            background: rgba(17, 24, 39, 0.95);
            border: 2px solid #facc15;
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            text-align: right;
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.3);
        }
        .form-control, .form-select {
            background: #0b0f19;
            border-color: #374151;
            color: #fff;
        }
        .form-control:focus, .form-select:focus {
            background: #0b0f19;
            color: #fff;
            border-color: #00f0ff;
            box-shadow: none;
        }
        .cat-admin-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b0f19;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid #374151;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="logo-box">
            <img id="display-logo" src="https://i.ibb.co/5W2Q429/vortex-logo.png" alt="Logo">
        </div>
        <h1 id="display-title">VORTEXPLAY</h1>
        <div class="subtitle" id="display-subtitle">♦ GAMING EMPIRE ♦</div>

        <div>
            <span class="status-badge" id="display-status">⚡ SYSTEM STATUS: ONLINE ⚡</span>
        </div>

        <div id="dynamic-content" style="width: 100%;"></div>

        <div id="admin-trigger-container">
            <button onclick="toggleAdminPanel()" class="btn-custom" id="admin-toggle-btn">⚙️ ورود به پنل مدیریت</button>
        </div>

        <div id="admin-panel" class="admin-panel-box" style="display: none;">
            <h4 class="text-warning mb-3">🛠️ اتاق فرمان مدیریت</h4>
            
            <div class="mb-3">
                <label class="form-label text-info">رمز عبور (عدد 1):</label>
                <input type="password" id="admin-pass-input" class="form-control" placeholder="عدد 1 را وارد کنید">
                <button onclick="verifyAdmin()" class="btn btn-warning btn-sm mt-2 w-100 fw-bold">باز کردن پنل</button>
            </div>

            <div id="admin-controls" style="display: none;">
                <hr style="border-color: #facc15;">
                <h6 class="text-info">ارسال پیام جدید به دسته‌ها</h6>
                <div class="mb-2">
                    <label class="form-label">انتخاب دسته:</label>
                    <select id="msg-cat-select" class="form-select"></select>
                </div>
                <div class="mb-2">
                    <label class="form-label">متن پیام (لینک، توضیحات...):</label>
                    <textarea id="msg-text-input" class="form-control" rows="3" placeholder="متن پیام را بنویسید..."></textarea>
                </div>
                <button onclick="sendNewMessage()" class="btn btn-success btn-sm w-100 fw-bold mb-3">ارسال پیام برای کاربران</button>

                <h6 class="text-info mt-3">مدیریت دسته‌بندی‌ها</h6>
                <div class="mb-2">
                    <input type="text" id="new-cat-title" class="form-control mb-1" placeholder="عنوان دسته (مثل PS5 GAME)">
                    <input type="text" id="new-cat-desc" class="form-control mb-1" placeholder="توضیحات کوتاه دسته">
                    <button onclick="addNewCategory()" class="btn btn-primary btn-sm w-100">افزودن دسته جدید</button>
                </div>
                <div id="admin-cat-list" class="mt-3"></div>

                <button onclick="logoutAdmin()" class="btn btn-outline-danger btn-sm w-100 mt-4">بستن و خروج از پنل</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASS = "1";

        let defaultData = {
            logo_url: "https://i.ibb.co/5W2Q429/vortex-logo.png",
            main_title: "VORTEXPLAY",
            subtitle: "♦ GAMING EMPIRE ♦",
            status: "SYSTEM STATUS: ONLINE",
            categories: [
                {id: "backup", title: "BACKUP & TUTORIALS", desc: "Guides & System Files", icon: "📚"},
                {id: "ps5", title: "PS5 GAME", desc: "PlayStation 5 Games & PKGs", icon: "🎮"},
                {id: "photos", title: "GAME PHOTOS", desc: "Wallpapers & Screenshots", icon: "🖼️"}
            ],
            messages: {}
        };

        let siteData = JSON.parse(localStorage.getItem('vortex_site_data')) || defaultData;

        document.getElementById('display-logo').src = siteData.logo_url;
        document.getElementById('display-title').innerText = siteData.main_title;
        document.getElementById('display-subtitle').innerText = siteData.subtitle;
        document.getElementById('display-status').innerText = "⚡ " + siteData.status + " ⚡";

        function renderRoute() {
            const urlParams = new URLSearchParams(window.location.search);
            const catId = urlParams.get('cat');
            const container = document.getElementById('dynamic-content');

            if (!catId) {
                let html = '';
                siteData.categories.forEach(cat => {
                    let msgCount = siteData.messages && siteData.messages[cat.id] ? siteData.messages[cat.id].length : 0;
                    html += `
                        <a href="?cat=${cat.id}" class="category-card">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="category-title">${cat.title}</div>
                                    <p class="category-desc">${cat.desc}</p>
                                    <small class="text-warning" style="font-size: 0.7rem;">تعداد پیام‌ها: ${msgCount}</small>
                                </div>
                                <div style="font-size: 1.5rem;">${cat.icon || '🎮'}</div>
                            </div>
                        </a>
                    `;
                });
                container.innerHTML = html;
            } else {
                let currentCat = siteData.categories.find(c => c.id === catId);
                let catTitle = currentCat ? currentCat.title : "پیام‌ها";
                
                let html = `
                    <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom border-info">
                        <h4 style="color: #00f0ff; margin:0; font-size: 1.2rem;">${catTitle}</h4>
                        <a href="?" class="btn btn-outline-info btn-sm" style="border-radius: 20px;">⬅️ بازگشت به منو</a>
                    </div>
                `;

                let messages = siteData.messages && siteData.messages[catId] ? siteData.messages[catId] : [];
                if (messages.length === 0) {
                    html += '<div class="text-center text-muted mt-5">هنوز پیامی در این بخش ارسال نشده است.</div>';
                } else {
                    messages.forEach(m => {
                        html += `
                            <div class="msg-card">
                                <div>${m.text}</div>
                                <div class="msg-date">${m.date}</div>
                            </div>
                        `;
                    });
                }
                container.innerHTML = html;
            }
        }

        renderRoute();

        function toggleAdminPanel() {
            let panel = document.getElementById('admin-panel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        function verifyAdmin() {
            let pass = document.getElementById('admin-pass-input').value;
            if (pass === ADMIN_PASS) {
                document.getElementById('admin-controls').style.display = 'block';
                alert("ورود موفقیت‌آمیز به پنل مدیریت!");
                updateAdminCategorySelect();
                renderAdminCategoryList();
            } else {
                alert("رمز عبور اشتباه است!");
            }
        }

        function updateAdminCategorySelect() {
            let select = document.getElementById('msg-cat-select');
            select.innerHTML = '';
            siteData.categories.forEach(cat => {
                select.innerHTML += `<option value="${cat.id}">${cat.title}</option>`;
            });
        }

        function renderAdminCategoryList() {
            let listDiv = document.getElementById('admin-cat-list');
            listDiv.innerHTML = '';
            siteData.categories.forEach((cat, index) => {
                listDiv.innerHTML += `
                    <div class="cat-admin-item">
                        <span style="font-size: 0.85rem;">${cat.title}</span>
                        <button onclick="deleteCategory(${index})" class="btn btn-danger btn-sm" style="padding: 2px 8px; font-size: 0.75rem;">حذف</button>
                    </div>
                `;
            });
        }

        function addNewCategory() {
            let t = document.getElementById('new-cat-title').value;
            let d = document.getElementById('new-cat-desc').value;
            if (t) {
                let newId = 'cat_' + Date.now();
                siteData.categories.push({id: newId, title: t, desc: d, icon: "🎮"});
                localStorage.setItem('vortex_site_data', JSON.stringify(siteData));
                document.getElementById('new-cat-title').value = '';
                document.getElementById('new-cat-desc').value = '';
                renderAdminCategoryList();
                updateAdminCategorySelect();
                renderRoute();
                alert("دسته جدید اضافه شد!");
            } else {
                alert("لطفا عنوان دسته را وارد کنید.");
            }
        }

        function deleteCategory(index) {
            let catId = siteData.categories[index].id;
            siteData.categories.splice(index, 1);
            if (siteData.messages && siteData.messages[catId]) {
                delete siteData.messages[catId];
            }
            localStorage.setItem('vortex_site_data', JSON.stringify(siteData));
            renderAdminCategoryList();
            updateAdminCategorySelect();
            renderRoute();
        }

        function sendNewMessage() {
            let catId = document.getElementById('msg-cat-select').value;
            let text = document.getElementById('msg-text-input').value;
            if (!text) {
                alert("لطفا متن پیام را بنویسید!");
                return;
            }
            if (!siteData.messages) siteData.messages = {};
            if (!siteData.messages[catId]) siteData.messages[catId] = [];

            let now = new Date().toLocaleDateString('fa-IR');
            siteData.messages[catId].push({text: text, date: now});
            localStorage.setItem('vortex_site_data', JSON.stringify(siteData));
            document.getElementById('msg-text-input').value = '';
            alert("پیام با موفقیت ارسال شد!");
            renderRoute();
        }

        function logoutAdmin() {
            document.getElementById('admin-controls').style.display = 'none';
            document.getElementById('admin-pass-input').value = '';
            document.getElementById('admin-panel').style.display = 'none';
        }
    </script>
</body>
</html>
