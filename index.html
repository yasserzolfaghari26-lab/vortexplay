
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEXPLAY | تم سلطنتی</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif;}

        :root {
            --gold: #D4AF37;
            --gold-light: #FFD700;
            --royal: #4B0082;
            --royal-light: #8A2BE2;
            --bg-main: #1A0E2B;
            --bg-card: #2B1447;
            --text-light: #FFFFFF;
        }

        body {
            background: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(212,175,55,0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(75,0,130,0.15) 0%, transparent 40%);
        }

        .container {max-width: 900px; margin: 0 auto; padding: 30px 20px;}

        /* کاور */
        .cover {
            width: 100%; height: 200px; border-radius: 16px; overflow: hidden;
            margin-bottom: -60px; position: relative; z-index: 1;
            box-shadow: 0 0 25px rgba(212,175,55,0.3);
        }
        .cover img {width: 100%; height: 100%; object-fit: cover;}

        /* دایره نئونی لوگو */
        .logo-wrap {
            width: 140px; height: 140px; margin: 0 auto; border-radius: 50%;
            background: var(--bg-main); display: flex; align-items: center; justify-content: center;
            position: relative; z-index: 2;
            box-shadow: 
                0 0 0 4px var(--gold),
                0 0 25px rgba(255,215,0,0.5),
                0 0 40px rgba(138,43,226,0.3);
            animation: pulse 3s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            from {box-shadow: 0 0 0 4px var(--gold), 0 0 25px rgba(255,215,0,0.5);}
            to   {box-shadow: 0 0 0 4px var(--royal-light), 0 0 30px rgba(138,43,226,0.6);}
        }
        .logo-wrap img {width: 115px; height: 115px; border-radius: 50%; object-fit: cover; border: 3px solid var(--gold);}

        header {text-align: center; padding: 20px 0 30px;}
        h1 {font-size: 2.4rem; color: var(--gold-light); text-shadow: 0 0 15px rgba(255,215,0,0.5); margin: 10px 0 5px;}
        .desc {color: #D0B8F0; font-size: 1rem;}

        .divider {
            height: 2px; border: none;
            background: linear-gradient(90deg, transparent, var(--gold), var(--royal-light), var(--gold), transparent);
            margin: 25px 0; box-shadow: 0 0 10px rgba(255,215,0,0.4);
        }

        /* دسته‌بندی */
        .cats {display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 25px;}
        .cat {
            padding: 10px 20px; background: var(--bg-card); border-radius: 30px; cursor: pointer;
            color: #D0B8F0; border: 2px solid transparent; transition: 0.3s;
        }
        .cat:hover, .cat.active {border-color: var(--gold); color: var(--gold-light); box-shadow: 0 0 12px rgba(255,215,0,0.3);}

        /* کارت محتوا */
        .card {
            background: var(--bg-card); border-radius: 16px; padding: 20px; margin-bottom: 15px;
            border: 1px solid rgba(212,175,55,0.2); transition: 0.3s;
        }
        .card:hover {border-color: var(--gold); box-shadow: 0 0 20px rgba(255,215,0,0.2); transform: translateY(-3px);}
        .card-img {width: 100%; height: 160px; border-radius: 10px; object-fit: cover; margin-bottom: 12px; background: linear-gradient(135deg, var(--royal), var(--gold));}
        .card h3 {color: var(--gold-light); margin-bottom: 6px;}
        .card p {color: #C0B0D0; margin-bottom: 12px; line-height: 1.7;}
        .btn-gold {
            display: inline-block; padding: 10px 20px; background: linear-gradient(135deg, #B8860B, #FFD700);
            color: white; border-radius: 8px; text-decoration: none; font-weight: bold; transition: 0.3s;
            box-shadow: 0 0 10px rgba(255,215,0,0.3);
        }
        .btn-gold:hover {transform: scale(1.03); box-shadow: 0 0 20px rgba(255,215,0,0.6);}

        /* === پنل مدیریت === */
        .admin-link {text-align: center; margin-top: 40px;}
        .admin-btn {
            padding: 12px 30px; background: transparent; border: 2px solid var(--gold);
            color: var(--gold-light); border-radius: 10px; font-weight: bold; cursor: pointer;
            transition: 0.3s; font-size: 1rem;
        }
        .admin-btn:hover {background: var(--gold); color: var(--bg-main); box-shadow: 0 0 20px rgba(255,215,0,0.5);}

        .panel {background: var(--bg-card); border-radius: 20px; padding: 25px; border: 1px solid rgba(212,175,55,0.3); margin-top: 20px;}
        .back {color: var(--gold-light); text-decoration: none; display: inline-block; margin-bottom: 20px;}
        
        /* دو دکمه اصلی پنل */
        .panel-tabs {display: flex; gap: 10px; margin-bottom: 25px;}
        .panel-tab {
            flex: 1; padding: 12px; background: transparent; border: 2px solid var(--royal-light);
            color: var(--royal-light); border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .panel-tab.active {background: var(--royal-light); color: white; box-shadow: 0 0 15px rgba(138,43,226,0.4);}
        
        input, textarea, select {
            width: 100%; padding: 12px; margin: 8px 0; border: 2px solid rgba(212,175,55,0.3);
            border-radius: 8px; background: rgba(0,0,0,0.2); color: white; font-size: 0.95rem;
        }
        input:focus, textarea:focus {outline: none; border-color: var(--gold); box-shadow: 0 0 10px rgba(255,215,0,0.3);}
        textarea {min-height: 90px; resize: vertical;}
        
        .file-label {
            display: block; padding: 12px; background: rgba(212,175,55,0.1); border: 2px dashed var(--gold);
            border-radius: 8px; text-align: center; cursor: pointer; margin: 10px 0;
        }
        
        .act-btn {padding: 12px 25px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 5px; transition: 0.3s;}
        .gold-btn {background: linear-gradient(135deg, #B8860B, #FFD700); color: white;}
        .gold-btn:hover {box-shadow: 0 0 15px rgba(255,215,0,0.5);}
        .purple-btn {background: linear-gradient(135deg, #4B0082, #8A2BE2); color: white;}
        .purple-btn:hover {box-shadow: 0 0 15px rgba(138,43,226,0.5);}
        .del-btn {background: #aa2233; color: white;}
        
        .ok {color: #00FF88; margin-top: 8px;}
        .err {color: #FF5566; margin-top: 8px;}
        .hidden {display: none !important;}
        
        .cat-item {display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: rgba(255,255,255,0.05); border-radius: 8px; margin: 5px 0;}
        footer {text-align: center; margin-top: 50px; padding: 20px; color: #776699; font-size: 0.9rem; border-top: 1px solid rgba(212,175,55,0.15);}
    </style>
</head>
<body>
    <div class="container" id="main-page">
        <!-- کاور -->
        <div class="cover">
            <img id="cover-img" src="" alt="کاور" onerror="this.src='https://via.placeholder.com/900x200/4B0082/FFD700?text=VORTEXPLAY'">
        </div>

        <header>
            <div class="logo-wrap">
                <img id="logo-img" src="" alt="لوگو" onerror="this.src='https://via.placeholder.com/115/D4AF37/FFFFFF?text=V'">
            </div>
            <h1 id="site-title">VORTEXPLAY</h1>
            <p class="desc" id="site-desc">درگاه سلطنتی محتوا و بازی‌ها</p>
        </header>

        <hr class="divider">

        <!-- دسته‌بندی‌ها -->
        <div class="cats" id="cats-bar"></div>

        <!-- لیست محتوا -->
        <div id="content-list" style="margin-top:25px;"></div>

        <div class="admin-link">
            <button class="admin-btn" onclick="showAdmin()">🔐 پنل مدیریت</button>
        </div>

        <footer>
            <p>© ۱۴۰۵ VORTEXPLAY | تم سلطنتی طلایی 👑</p>
        </footer>
    </div>

    <!-- صفحه مدیریت -->
    <div class="container hidden" id="admin-page">
        <a href="javascript:hideAdmin()" class="back">← بازگشت به سایت</a>

        <!-- ورود -->
        <div id="login-box" class="panel">
            <h2>🔐 ورود به پنل مدیریت</h2>
            <input type="password" id="pass-input" placeholder="رمز ۳۲ رقمی را وارد کنید...">
            <button class="act-btn gold-btn" onclick="checkPass()">ورود</button>
            <p id="login-msg" class="err"></p>
        </div>

        <!-- پنل اصلی با دو بخش -->
        <div id="admin-panel" class="panel hidden">
            <h2>👑 کنترل کامل سایت</h2>
            <hr style="border:none; border-top:1px solid rgba(212,175,55,0.2); margin:20px 0;">

            <!-- دو دکمه جابجایی بین بخش‌ها -->
            <div class="panel-tabs">
                <button class="panel-tab active" onclick="switchTab('design')">🎨 ظاهر سایت</button>
                <button class="panel-tab" onclick="switchTab('content')">📦 مدیریت محتوا</button>
            </div>

            <!-- === بخش اول: ظاهر سایت === -->
            <div id="tab-design">
                <h3>🎨 تنظیمات ظاهری</h3>
                
                <label class="file-label">
                    📷 انتخاب لوگو از گالری
                    <input type="file" id="logo-file" accept="image/*" style="display:none" onchange="previewLogo(event)">
                </label>
                <p id="logo-status" class="ok"></p>

                <label class="file-label">
                    🖼️ انتخاب کاور بالای صفحه
                    <input type="file" id="cover-file" accept="image/*" style="display:none" onchange="previewCover(event)">
                </label>
                <p id="cover-status" class="ok"></p>

                <label>🎨 رنگ پس‌زمینه:</label>
                <input type="color" id="bg-color-picker" value="#1A0E2B">
                <button class="act-btn purple-btn" onclick="applyBgColor()">اعمال پس‌زمینه</button>

                <input type="text" id="input-title" placeholder="نام سایت">
                <input type="text" id="input-desc" placeholder="توضیح کوتاه سایت">
                
                <button class="act-btn gold-btn" onclick="saveDesignSettings()">✅ ذخیره تغییرات ظاهری</button>
                <p id="design-msg" class="ok"></p>
            </div>

            <!-- === بخش دوم: مدیریت محتوا === -->
            <div id="tab-content" class="hidden">
                <!-- دسته‌بندی‌ها -->
                <h3>📂 دسته‌بندی‌ها</h3>
                <input type="text" id="new-cat-name" placeholder="نام دسته‌بندی جدید">
                <button class="act-btn purple-btn" onclick="addCategory()">➕ ساخت دسته‌بندی</button>
                <div id="cat-list" style="margin-top:15px;"></div>

                <hr style="border:none; border-top:1px solid rgba(212,175,55,0.2); margin:25px 0;">

                <!-- محتوای جدید -->
                <h3>➕ انتشار محتوای جدید</h3>
                <select id="content-category">
                    <!-- دسته‌ها اینجا نمایش داده میشن -->
                </select>
                <input type="text" id="content-title" placeholder="عنوان / نام بازی">
                <textarea id="content-text" placeholder="توضیحات و معرفی..."></textarea>
                
                <label class="file-label">
                    📷 انتخاب عکس از گالری
                    <input type="file" id="content-image-file" accept="image/*" style="display:none" onchange="previewContentImage(event)">
                </label>
                <p id="content-img-status" class="ok"></p>
                
                <input type="url" id="content-download-link" placeholder="لینک دانلود یا ورود">
                
                <button class="act-btn gold-btn" onclick="publishContent()">✅ انتشار محتوا</button>
                <p id="content-msg" class="ok"></p>
            </div>
        </div>
    </div>

    <script>
        // === تنظیمات اصلی ===
        let ADMIN_PASSWORD = "VORTEX9X7K2P4R8M3N5L6J1H9G8F7D6S5A4D3B";
        let activeTab = 'design';
        let selectedLogo = null, selectedCover = null, selectedContentImage = null;
        let activeCategoryFilter = 'همه';

        // === بارگذاری همه داده‌ها از حافظه ===
        function loadAllData() {
            // رمز
            const savedPass = localStorage.getItem('admin_password');
            if(savedPass) ADMIN_PASSWORD = savedPass;

            // تنظیمات ظاهری
            const siteTitle = localStorage.getItem('site_title') || 'VORTEXPLAY';
            const siteDesc = localStorage.getItem('site_description') || 'درگاه سلطنتی محتوا و بازی‌ها';
            const logo = localStorage.getItem('site_logo');
            const cover = localStorage.getItem('site_cover');
            const bgColor = localStorage.getItem('site_background');

            document.getElementById('site-title').textContent = siteTitle;
            document.getElementById('site-desc').textContent = siteDesc;
            if(logo) document.getElementById('logo-img').src = logo;
            if(cover) document.getElementById('cover-img').src = cover;
            if(bgColor) document.body.style.background = bgColor;

            // پر کردن فرم‌ها با مقادیر فعلی
            document.getElementById('input-title').value = siteTitle;
            document.getElementById('input-desc').value = siteDesc;
            if(bgColor) document.getElementById('bg-color-picker').value = bgColor;

            // نمایش محتوا
            renderCategories();
            renderContentList();
        }

        // === جابجایی بین دو تب پنل ===
        function switchTab(tabName) {
            activeTab = tabName;
            // تغییر حالت دکمه‌ها
            document.querySelectorAll('.panel-tab').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            // نمایش/پنهان کردن بخش‌ها
            document.getElementById('tab-design').classList.toggle('hidden', tabName !== 'design');
            document.getElementById('tab-content').classList.toggle('hidden', tabName !== 'content');
            // به‌روزرسانی لیست دسته‌بندی‌ها
            if(tabName === 'content') renderCategoriesInPanel();
        }

        // === دسته‌بندی‌ها ===
        function getCategories() {
            return JSON.parse(localStorage.getItem('categories_list') || '["همه"]');
        }
        function saveCategories(categories) {
            localStorage.setItem('categories_list', JSON.stringify(categories));
        }
        function renderCategories() {
            const cats = getCategories();
            const bar = document.getElementById('cats-bar');
            bar.innerHTML = '';
            
            cats.forEach(cat => {
                const tab = document.createElement('span');
                tab.className = 'cat' + (cat === activeCategoryFilter ? ' active' : '');
                tab.textContent = cat;
                tab.onclick = () => {
                    activeCategoryFilter = cat;
                    renderCategories();
                    renderContentList();
                };
                bar.appendChild(tab);
            });
        }
        function renderCategoriesInPanel() {
            const cats = getCategories();
            const list = document.getElementById('cat-list');
            const select = document.getElementById('content-category');
            
            // لیست قابل حذف
            list.innerHTML = '';
            cats.filter(c => c !== 'همه').forEach(cat => {
                const item = document.createElement('div');
                item.className = 'cat-item';
                item.innerHTML = `
                    <span>${cat}</span>
                    <button class="act-btn del-btn" style="padding:6px 12px; font-size:0.85rem;" onclick="deleteCategory('${cat}')">حذف</button>
                `;
                list.appendChild(item);
            });

            // منوی انتخاب
            select.innerHTML = '';
            cats.filter(c => c !== 'همه').forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
        }
        function addCategory() {
            const name = document.getElementById('new-cat-name').value.trim();
            if(!name) return alert('⚠️ نام دسته‌بندی را بنویس!');
            
            const cats = getCategories();
            if(cats.includes(name)) return alert('⚠️ این دسته‌بندی قبلاً وجود دارد!');
            
            cats.push(name);
            saveCategories(cats);
            document.getElementById('new-cat-name').value = '';
            
            renderCategories();
            renderCategoriesInPanel();
            alert('✅ دسته‌بندی ساخته شد!');
        }
        function deleteCategory(name) {
            if(!confirm(`آیا از حذف "${name}" اطمینان داری؟`)) return;
            let cats = getCategories().filter(c => c !== name);
            saveCategories(cats);
            renderCategories();
            renderCategoriesInPanel();
        }

        // === محتواها ===
        function getAllContent() {
            return JSON.parse(localStorage.getItem('contents_list') || '[]');
        }
        function saveAllContent(items) {
            localStorage.setItem('contents_list', JSON.stringify(items));
        }
        function renderContentList() {
            let items = getAllContent();
            if(activeCategoryFilter !== 'همه') {
                items = items.filter(i => i.category === activeCategoryFilter);
            }
            
            const list = document.getElementById('content-list');
            list.innerHTML = '';
            
            if(items.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#776699; padding:30px;">هنوز محتوایی منتشر نشده</p>';
                return;
            }
            
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    ${item.image ? `<img src="${item.image}" class="card-img" alt="">` : ''}
                    <h3>${item.title}</h3>
                    <p>${item.description}</p>
                    <a href="${item.link}" target="_blank" class="btn-gold">دانلود / ورود 📥</a>
                `;
                list.appendChild(card);
            });
        }
        function publishContent() {
            const category = document.getElementById('content-category').value;
            const title = document.getElementById('content-title').value.trim();
            const desc = document.getElementById('content-text').value.trim();
            const link = document.getElementById('content-download-link').value.trim();
            
            if(!category || !title || !link) {
                return alert('⚠️ عنوان، دسته‌بندی و لینک را پر کن!');
            }
            
            const items = getAllContent();
            items.unshift({
                category,
                title,
                description: desc,
                link,
                image: selectedContentImage
            });
            saveAllContent(items);
            
            // پاک کردن فرم
            document.getElementById('content-title').value = '';
            document.getElementById('content-text').value = '';
            document.getElementById('content-download-link').value = '';
            selectedContentImage = null;
            document.getElementById('content-img-status').textContent = '';
            
            renderContentList();
            document.getElementById('content-msg').textContent = '✅ محتوا منتشر شد!';
            setTimeout(() => document.getElementById('content-msg').textContent = '', 3000);
        }

        // === پیش‌نمایش عکس‌ها از گالری ===
        function previewLogo(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                selectedLogo = e.target.result;
                document.getElementById('logo-status').textContent = '✅ لوگو آماده ذخیره است';
            };
            reader.readAsDataURL(file);
        }
        function previewCover(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                selectedCover = e.target.result;
                document.getElementById('cover-status').textContent = '✅ کاور آماده ذخیره است';
            };
            reader.readAsDataURL(file);
        }
        function previewContentImage(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                selectedContentImage = e.target.result;
                document.getElementById('content-img-status').textContent = '✅ عکس انتخاب شد';
            };
            reader.readAsDataURL(file);
        }

        // === ذخیره تنظیمات ظاهری ===
        function saveDesignSettings() {
            const title = document.getElementById('input-title').value.trim();
            const desc = document.getElementById('input-desc').value.trim();
            
            if(title) {
                localStorage.setItem('site_title', title);
                document.getElementById('site-title').textContent = title;
            }
            if(desc) {
                localStorage.setItem('site_description', desc);
                document.getElementById('site-desc').textContent = desc;
            }
            if(selectedLogo) {
                localStorage.setItem('site_logo', selectedLogo);
                document.getElementById('logo-img').src = selectedLogo;
                selectedLogo = null;
            }
            if(selectedCover) {
                localStorage.setItem('site_cover', selectedCover);
                document.getElementById('cover-img').src = selectedCover;
                selectedCover = null;
            }
            
            document.getElementById('design-msg').textContent = '✅ همه تغییرات ذخیره شد!';
            setTimeout(() => document.getElementById('design-msg').textContent = '', 3000);
        }
        function applyBgColor() {
            const color = document.getElementById('bg-color-picker').value;
            document.body.style.background = color;
            localStorage.setItem('site_background', color);
            alert('✅ پس‌زمینه تغییر کرد!');
        }

        // === ورود و مدیریت ===
        function showAdmin() {
            document.getElementById('main-page').classList.add('hidden');
            document.getElementById('admin-page').classList.remove('hidden');
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('login-box').classList.remove('hidden');
        }
        function hideAdmin() {
            document.getElementById('admin-page').classList.add('hidden');
            document.getElementById('main-page').classList.remove('hidden');
            document.getElementById('pass-input').value = '';
        }
        function checkPass() {
            const input = document.getElementById('pass-input').value.trim();
            if(input === ADMIN_PASSWORD) {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                // بازنشانی تب اول
                activeTab = 'design';
                document.querySelectorAll('.panel-tab').forEach((btn, idx) => {
                    btn.classList.toggle('active', idx === 0);
                });
                document.getElementById('tab-design').classList.remove('hidden');
                document.getElementById('tab-content').classList.add('hidden');
            } else {
                document.getElementById('login-msg').textContent = '❌ رمز اشتباه است!';
            }
        }

        // === شروع برنامه ===
        loadAllData();
    </script>
</body>
</html>
