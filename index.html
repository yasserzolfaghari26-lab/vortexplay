<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEXPLAY | پایدار</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif;}

        :root {
            --blue-deep: #001F3F;
            --blue-main: #0077FF;
            --blue-light: #00BFFF;
            --blue-sky: #87CEEB;
            --bg-card: rgba(0, 50, 100, 0.75);
            --text-light: #FFFFFF;
            --text-dim: #B0D0F0;
        }

        body {
            background: linear-gradient(135deg, #001F3F, #003366, #004488);
            color: var(--text-light);
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background 0.3s ease;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(0,119,255,0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0,191,255,0.12) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {max-width: 900px; margin: 0 auto; padding: 30px 20px; position: relative; z-index: 1;}

        /* === کاور === */
        .cover {
            width: 100%; height: 220px; border-radius: 20px; overflow: hidden;
            margin-bottom: -70px; position: relative; z-index: 2;
            box-shadow: 0 0 30px rgba(0,119,255,0.4), inset 0 0 40px rgba(0,0,0,0.4);
            border: 2px solid rgba(0,191,255,0.3);
        }
        .cover img {width: 100%; height: 100%; object-fit: cover;}

        /* === لوگو === */
        .logo-wrap {
            width: 150px; height: 150px; margin: 0 auto; border-radius: 50%;
            background: #001F3F; display: flex; align-items: center; justify-content: center;
            position: relative; z-index: 3;
            box-shadow: 
                0 0 0 4px var(--blue-light),
                0 0 30px rgba(0,191,255,0.6);
            animation: bluePulse 3s ease-in-out infinite alternate;
        }
        @keyframes bluePulse {
            from {box-shadow: 0 0 0 4px var(--blue-light), 0 0 30px rgba(0,191,255,0.6);}
            to   {box-shadow: 0 0 0 4px var(--blue-main), 0 0 40px rgba(0,119,255,0.8);}
        }
        .logo-wrap img {width: 125px; height: 125px; border-radius: 50%; object-fit: cover; border: 3px solid var(--blue-light);}

        header {text-align: center; padding: 20px 0 35px;}
        h1 {font-size: 2.6rem; color: var(--blue-light); text-shadow: 0 0 20px rgba(0,191,255,0.6); margin: 15px 0 8px;}
        .desc {color: var(--text-dim); font-size: 1.1rem;}

        .divider {
            height: 3px; border: none;
            background: linear-gradient(90deg, transparent, var(--blue-light), var(--blue-main), var(--blue-light), transparent);
            margin: 30px 0; border-radius: 2px;
            box-shadow: 0 0 15px rgba(0,191,255,0.4);
        }

        /* === دسته‌بندی === */
        .cats {display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 30px;}
        .cat {
            padding: 12px 24px; background: var(--bg-card); border-radius: 50px; cursor: pointer;
            color: var(--text-dim); border: 2px solid transparent; transition: 0.3s;
            backdrop-filter: blur(10px);
        }
        .cat:hover, .cat.active {
            border-color: var(--blue-light); color: var(--blue-sky);
            box-shadow: 0 0 20px rgba(0,191,255,0.4); transform: translateY(-2px);
        }

        /* === کارت === */
        .card {
            background: var(--bg-card); border-radius: 18px; padding: 22px; margin-bottom: 18px;
            border: 2px solid rgba(0,191,255,0.2); transition: 0.3s;
            backdrop-filter: blur(10px);
        }
        .card:hover {
            border-color: var(--blue-light); box-shadow: 0 0 30px rgba(0,191,255,0.25);
            transform: translateY(-4px);
        }
        .card-img {width: 100%; height: 180px; border-radius: 12px; object-fit: cover; margin-bottom: 15px; background: linear-gradient(135deg, var(--blue-deep), var(--blue-light));}
        .card h3 {color: var(--blue-sky); margin-bottom: 8px; font-size: 1.3rem;}
        .card p {color: var(--text-dim); margin-bottom: 15px; line-height: 1.8;}
        
        .download-link {
            display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px;
            background: linear-gradient(135deg, #0077FF, #00BFFF);
            color: white; border-radius: 8px; text-decoration: none; font-weight: bold;
            margin: 6px; transition: 0.3s; box-shadow: 0 0 12px rgba(0,191,255,0.4);
        }
        .download-link:hover {transform: scale(1.05); box-shadow: 0 0 25px rgba(0,191,255,0.7);}

        /* === دکمه مدیریت — همیشه قابل دیدن === */
        .admin-link {text-align: center; margin-top: 50px; position: relative; z-index: 999;}
        .admin-btn {
            padding: 14px 40px; background: rgba(0,30,60,0.8); border: 2px solid var(--blue-light);
            color: var(--blue-sky); border-radius: 12px; font-weight: bold; cursor: pointer;
            transition: 0.3s; font-size: 1.05rem;
            position: relative; z-index: 999;
        }
        .admin-btn:hover {
            background: var(--blue-main); color: white; 
            box-shadow: 0 0 25px rgba(0,191,255,0.5); transform: scale(1.03);
        }

        /* === پنل مدیریت — لایه جدا === */
        .admin-overlay {
            position: fixed; inset: 0; background: rgba(0,10,30,0.92);
            z-index: 9999; display: none; overflow-y: auto; padding: 20px;
        }
        .admin-overlay.show {display: block;}
        
        .panel {
            background: var(--bg-card); border-radius: 24px; padding: 28px; border: 2px solid rgba(0,191,255,0.3);
            max-width: 700px; margin: 20px auto; backdrop-filter: blur(15px);
        }
        .back-btn {color: var(--blue-light); text-decoration: none; display: inline-block; margin-bottom: 20px; font-weight: bold; cursor: pointer;}
        .back-btn:hover {text-shadow: 0 0 10px rgba(0,191,255,0.5);}
        
        .panel-tabs {display: flex; gap: 12px; margin-bottom: 30px;}
        .tab {
            flex: 1; padding: 14px; background: transparent; border: 2px solid var(--blue-main);
            color: #90C0F0; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .tab.active {
            background: linear-gradient(135deg, #0055CC, #0099FF);
            color: white; box-shadow: 0 0 20px rgba(0,119,255,0.4); border-color: transparent;
        }
        
        input, textarea, select {
            width: 100%; padding: 14px; margin: 10px 0; border: 2px solid rgba(0,191,255,0.3);
            border-radius: 10px; background: rgba(0,20,50,0.5); color: white; font-size: 0.98rem;
        }
        input:focus, textarea:focus {outline: none; border-color: var(--blue-light); box-shadow: 0 0 15px rgba(0,191,255,0.3);}
        textarea {min-height: 100px; resize: vertical;}
        
        .file-upload {
            display: block; padding: 16px; background: rgba(0,119,255,0.1); border: 2px dashed var(--blue-light);
            border-radius: 12px; text-align: center; cursor: pointer; margin: 12px 0; transition: 0.3s;
        }
        .file-upload:hover {background: rgba(0,119,255,0.2); border-style: solid;}
        
        .act-btn {padding: 14px 28px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin: 6px; transition: 0.3s; font-size: 0.98rem;}
        .blue-btn {background: linear-gradient(135deg, #0066CC, #00BFFF); color: white;}
        .blue-btn:hover {box-shadow: 0 0 25px rgba(0,191,255,0.6); transform: scale(1.03);}
        .del-btn {background: linear-gradient(135deg, #CC2233, #EE4455); color: white;}
        .add-link-btn {padding: 10px 18px; background: #009944; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 8px 0;}
        
        .success {color: #00FF99; margin-top: 10px;}
        .error {color: #FF6677; margin-top: 10px;}
        .hidden {display: none !important;}
        
        .item-row {display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(255,255,255,0.05); border-radius: 10px; margin: 8px 0;}
        .link-row {display: flex; gap: 8px; align-items: center; flex-wrap: wrap;}
        .link-row input {margin: 0; flex: 1; min-width: 150px;}
        
        footer {text-align: center; margin-top: 60px; padding: 25px; color: #6699CC; font-size: 0.95rem; border-top: 1px solid rgba(0,191,255,0.15);}
    </style>
</head>
<body>
    <div class="container" id="main-page">
        <!-- کاور -->
        <div class="cover">
            <img id="cover-img" src="" alt="کاور" onerror="this.src='https://via.placeholder.com/900x220/001F3F/00BFFF?text=VORTEXPLAY'">
        </div>

        <header>
            <div class="logo-wrap">
                <img id="logo-img" src="" alt="لوگو" onerror="this.src='https://via.placeholder.com/125/0077FF/FFFFFF?text=VP'">
            </div>
            <h1 id="site-title">VORTEXPLAY</h1>
            <p class="desc" id="site-desc">پایگاه آبی بازی‌ها و سرگرمی</p>
        </header>

        <hr class="divider">

        <div class="cats" id="cats-bar"></div>
        <div id="content-list"></div>

        <div class="admin-link">
            <button class="admin-btn" onclick="openAdminPanel()">🔐 پنل مدیریت</button>
        </div>

        <footer>
            <p>💙 VORTEXPLAY | نسخه پایدار 🔥</p>
        </footer>
    </div>

    <!-- === پنل مدیریت جداگانه — همیشه بالا === -->
    <div class="admin-overlay" id="adminOverlay">
        <div class="panel">
            <a class="back-btn" onclick="closeAdminPanel()">← بازگشت به سایت</a>

            <!-- ورود -->
            <div id="loginBox">
                <h2>🔐 ورود به پنل</h2>
                <input type="password" id="passInput" placeholder="رمز ۳۲ رقمی">
                <button class="act-btn blue-btn" onclick="checkPassword()">ورود ✅</button>
                <p id="loginMsg" class="error"></p>
            </div>

            <!-- محتوای پنل -->
            <div id="adminContent" class="hidden">
                <h2>💙 کنترل کامل سایت</h2>
                <hr style="border:none; border-top:1px solid rgba(0,191,255,0.2); margin:20px 0;">

                <div class="panel-tabs">
                    <button class="tab active" onclick="switchTab('design')">🎨 ظاهر و پس‌زمینه</button>
                    <button class="tab" onclick="switchTab('content')">📦 محتوا و لینک‌ها</button>
                </div>

                <!-- تب ظاهر -->
                <div id="tab-design">
                    <h3>🎨 پس‌زمینه</h3>
                    <label>رنگ پس‌زمینه:</label>
                    <input type="color" id="bgColorPicker" value="#001F3F">
                    <button class="act-btn blue-btn" onclick="saveBgColor()">اعمال رنگ</button>
                    
                    <label class="file-upload">
                        📷 عکس پس‌زمینه
                        <input type="file" id="bgImageInput" accept="image/*" style="display:none" onchange="handleBgImageSelect(event)">
                    </label>
                    <p id="bgImageStatus" class="success"></p>
                    <button class="act-btn del-btn" onclick="clearBgImage()">حذف عکس پس‌زمینه</button>

                    <hr style="border:none; border-top:1px solid rgba(0,191,255,0.2); margin:25px 0;">

                    <h3>🖼️ لوگو و کاور</h3>
                    <label class="file-upload">
                        📷 لوگو
                        <input type="file" id="logoInput" accept="image/*" style="display:none" onchange="handleLogoSelect(event)">
                    </label>
                    <p id="logoStatus" class="success"></p>

                    <label class="file-upload">
                        🖼️ کاور بالای صفحه
                        <input type="file" id="coverInput" accept="image/*" style="display:none" onchange="handleCoverSelect(event)">
                    </label>
                    <p id="coverStatus" class="success"></p>

                    <input type="text" id="titleInput" placeholder="نام سایت">
                    <input type="text" id="descInput" placeholder="توضیح سایت">

                    <button class="act-btn blue-btn" onclick="saveAllDesign()">✅ ذخیره همه</button>
                    <p id="designMsg" class="success"></p>
                </div>

                <!-- تب محتوا -->
                <div id="tab-content" class="hidden">
                    <h3>📂 دسته‌بندی‌ها</h3>
                    <input type="text" id="newCatInput" placeholder="نام دسته‌بندی جدید">
                    <button class="act-btn blue-btn" onclick="addNewCategory()">➕ ساخت</button>
                    <div id="catListPanel" style="margin-top:15px;"></div>

                    <hr style="border:none; border-top:1px solid rgba(0,191,255,0.2); margin:25px 0;">

                    <h3>➕ انتشار محتوا</h3>
                    <select id="contentCatSelect"></select>
                    <input type="text" id="contentTitleInput" placeholder="عنوان">
                    <textarea id="contentDescInput" placeholder="توضیحات"></textarea>
                    
                    <label class="file-upload">
                        📷 عکس کاور محتوا
                        <input type="file" id="contentImgInput" accept="image/*" style="display:none" onchange="handleContentImgSelect(event)">
                    </label>
                    <p id="contentImgStatus" class="success"></p>

                    <h4 style="margin:15px 0 5px;">🔗 لینک‌های دانلود (نامحدود)</h4>
                    <div id="linksContainer">
                        <div class="link-row">
                            <input type="text" class="link-name" placeholder="نام لینک">
                            <input type="url" class="link-url" placeholder="لینک">
                            <button class="act-btn del-btn" style="padding:10px 12px;" onclick="this.parentElement.remove()">×</button>
                        </div>
                    </div>
                    <button class="add-link-btn" onclick="addNewLinkRow()">➕ افزودن لینک</button>

                    <button class="act-btn blue-btn" onclick="publishNewContent()">✅ انتشار</button>
                    <p id="publishMsg" class="success"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === تنظیمات ===
        const PASSWORD = "VORTEX9X7K2P4R8M3N5L6J1H9G8F7D6S5A4D3B";
        let currentTab = 'design';
        let tempBgImage = null, tempLogo = null, tempCover = null, tempContentImg = null;
        let activeCategory = 'همه';

        // === بارگذاری اولیه ===
        function init() {
            // پس‌زمینه
            const savedBgImg = localStorage.getItem('bg_image');
            const savedBgColor = localStorage.getItem('bg_color');
            if(savedBgImg) document.body.style.backgroundImage = `url(${savedBgImg})`;
            if(savedBgColor) {
                document.body.style.background = savedBgColor;
                document.getElementById('bgColorPicker').value = savedBgColor;
            }

            // لوگو، کاور، عنوان
            const savedLogo = localStorage.getItem('logo_image');
            const savedCover = localStorage.getItem('cover_image');
            const savedTitle = localStorage.getItem('site_title') || 'VORTEXPLAY';
            const savedDesc = localStorage.getItem('site_desc') || 'پایگاه آبی بازی‌ها و سرگرمی';
            
            if(savedLogo) document.getElementById('logo-img').src = savedLogo;
            if(savedCover) document.getElementById('cover-img').src = savedCover;
            document.getElementById('site-title').textContent = savedTitle;
            document.getElementById('site-desc').textContent = savedDesc;
            document.getElementById('titleInput').value = savedTitle;
            document.getElementById('descInput').value = savedDesc;

            renderCategories();
            renderAllContent();
        }

        // === باز و بسته کردن پنل ===
        function openAdminPanel() {
            document.getElementById('adminOverlay').classList.add('show');
            document.getElementById('loginBox').classList.remove('hidden');
            document.getElementById('adminContent').classList.add('hidden');
            document.getElementById('passInput').value = '';
            document.getElementById('loginMsg').textContent = '';
        }
        function closeAdminPanel() {
            document.getElementById('adminOverlay').classList.remove('show');
        }
        function checkPassword() {
            if(document.getElementById('passInput').value.trim() === PASSWORD) {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                switchTab('design');
                renderCategoriesInPanel();
            } else {
                document.getElementById('loginMsg').textContent = '❌ رمز اشتباه!';
            }
        }

        // === جابجایی تب‌ها ===
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach((b, i) => {
                b.classList.toggle('active', 
                    (tab === 'design' && i === 0) || (tab === 'content' && i === 1));
            });
            document.getElementById('tab-design').classList.toggle('hidden', tab !== 'design');
            document.getElementById('tab-content').classList.toggle('hidden', tab !== 'content');
            if(tab === 'content') renderCategoriesInPanel();
        }

        // === پس‌زمینه ===
        function saveBgColor() {
            const color = document.getElementById('bgColorPicker').value;
            document.body.style.background = color;
            document.body.style.backgroundImage = '';
            localStorage.setItem('bg_color', color);
            localStorage.removeItem('bg_image');
            tempBgImage = null;
            alert('✅ رنگ پس‌زمینه ذخیره شد!');
        }
        function handleBgImageSelect(e) {
            const reader = new FileReader();
            reader.onload = ev => {
                tempBgImage = ev.target.result;
                document.getElementById('bgImageStatus').textContent = '✅ عکس آماده ذخیره';
            };
            reader.readAsDataURL(e.target.files[0]);
        }
        function clearBgImage() {
            localStorage.removeItem('bg_image');
            document.body.style.backgroundImage = '';
            tempBgImage = null;
            alert('✅ عکس پس‌زمینه حذف شد!');
        }

        // === لوگو و کاور ===
        function handleLogoSelect(e) {
            const r = new FileReader();
            r.onload = ev => { tempLogo = ev.target.result; document.getElementById('logoStatus').textContent = '✅ لوگو آماده'; };
            r.readAsDataURL(e.target.files[0]);
        }
        function handleCoverSelect(e) {
            const r = new FileReader();
            r.onload = ev => { tempCover = ev.target.result; document.getElementById('coverStatus').textContent = '✅ کاور آماده'; };
            r.readAsDataURL(e.target.files[0]);
        }
        function saveAllDesign() {
            if(tempBgImage) {
                localStorage.setItem('bg_image', tempBgImage);
                document.body.style.backgroundImage = `url(${tempBgImage})`;
                localStorage.removeItem('bg_color');
                tempBgImage = null;
                document.getElementById('bgImageStatus').textContent = '';
            }
            if(tempLogo) {
                localStorage.setItem('logo_image', tempLogo);
                document.getElementById('logo-img').src = tempLogo;
                tempLogo = null;
                document.getElementById('logoStatus').textContent = '';
            }
            if(tempCover) {
                localStorage.setItem('cover_image', tempCover);
                document.getElementById('cover-img').src = tempCover;
                tempCover = null;
                document.getElementById('coverStatus').textContent = '';
            }
            const t = document.getElementById('titleInput').value.trim();
            const d = document.getElementById('descInput').value.trim();
            if(t) { localStorage.setItem('site_title', t); document.getElementById('site-title').textContent = t; }
            if(d) { localStorage.setItem('site_desc', d); document.getElementById('site-desc').textContent = d; }
            
            document.getElementById('designMsg').textContent = '✅ همه تغییرات ذخیره شد!';
            setTimeout(() => document.getElementById('designMsg').textContent = '', 3000);
        }

        // === دسته‌بندی‌ها ===
        function getCategories() { return JSON.parse(localStorage.getItem('categories_list') || '["همه"]'); }
        function saveCategories(arr) { localStorage.setItem('categories_list', JSON.stringify(arr)); }
        function renderCategories() {
            const container = document.getElementById('cats-bar');
            container.innerHTML = '';
            getCategories().forEach(cat => {
                const span = document.createElement('span');
                span.className = 'cat' + (cat === activeCategory ? ' active' : '');
                span.textContent = cat;
                span.onclick = () => { activeCategory = cat; renderCategories(); renderAllContent(); };
                container.appendChild(span);
            });
        }
        function renderCategoriesInPanel() {
            const list = document.getElementById('catListPanel');
            const select = document.getElementById('contentCatSelect');
            list.innerHTML = ''; select.innerHTML = '';
            getCategories().filter(c => c !== 'همه').forEach(cat => {
                list.innerHTML += `<div class="item-row"><span>${cat}</span><button class="act-btn del-btn" style="padding:6px 12px;" onclick="deleteCategory('${cat}')">حذف</button></div>`;
                select.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
        }
        function addNewCategory() {
            const name = document.getElementById('newCatInput').value.trim();
            if(!name) return alert('⚠️ نام بنویس!');
            const cats = getCategories();
            if(cats.includes(name)) return alert('قبلاً وجود دارد!');
            cats.push(name);
            saveCategories(cats);
            document.getElementById('newCatInput').value = '';
            renderCategories();
            renderCategoriesInPanel();
            alert('✅ دسته‌بندی اضافه شد!');
        }
        function deleteCategory(name) {
            if(!confirm(`حذف "${name}"؟`)) return;
            saveCategories(getCategories().filter(c => c !== name));
            renderCategories();
            renderCategoriesInPanel();
        }

        // === لینک‌های نامحدود ===
        function addNewLinkRow() {
            const container = document.getElementById('linksContainer');
            const row = document.createElement('div');
            row.className = 'link-row';
            row.innerHTML = `
                <input type="text" class="link-name" placeholder="نام لینک">
                <input type="url" class="link-url" placeholder="لینک">
                <button class="act-btn del-btn" style="padding:10px 12px;" onclick="this.parentElement.remove()">×</button>
            `;
            container.appendChild(row);
        }

        // === محتوا ===
        function getAllContent() { return JSON.parse(localStorage.getItem('content_list') || '[]'); }
        function saveAllContent(arr) { localStorage.setItem('content_list', JSON.stringify(arr)); }
        function handleContentImgSelect(e) {
            const r = new FileReader();
            r.onload = ev => { tempContentImg = ev.target.result; document.getElementById('contentImgStatus').textContent = '✅ عکس انتخاب شد'; };
            r.readAsDataURL(e.target.files[0]);
        }
        function renderAllContent() {
            let items = getAllContent();
            if(activeCategory !== 'همه') {
                items = items.filter(i => i.category === activeCategory);
            }
            const container = document.getElementById('content-list');
            container.innerHTML = '';
            if(!items.length) {
                container.innerHTML = '<p style="text-align:center; color:#6699CC; padding:40px;">هنوز محتوایی نیست</p>';
                return;
            }
            items.forEach(item => {
                let linksHtml = '';
                if(item.links) {
                    item.links.forEach(link => {
                        linksHtml += `<a href="${link.url}" target="_blank" class="download-link">${link.name || 'دانلود'} 📥</a>`;
                    });
                }
                container.innerHTML += `
                    <div class="card">
                        ${item.image ? `<img src="${item.image}" class="card-img" alt="">` : ''}
                        <h3>${item.title}</h3>
                        <p>${item.desc}</p>
                        <div style="margin-top:10px;">${linksHtml}</div>
                    </div>
                `;
            });
        }
        function publishNewContent() {
            const cat = document.getElementById('contentCatSelect').value;
            const title = document.getElementById('contentTitleInput').value.trim();
            const desc = document.getElementById('contentDescInput').value.trim();
            
            // جمع‌آوری لینک‌ها
            const linkRows = document.querySelectorAll('#linksContainer .link-row');
            const links = [];
            linkRows.forEach(row => {
                const name = row.querySelector('.link-name').value.trim() || 'دانلود';
                const url = row.querySelector('.link-url').value.trim();
                if(url) links.push({name, url});
            });

            if(!cat || !title || links.length === 0) {
                return alert('⚠️ دسته‌بندی، عنوان و حداقل یک لینک لازم است!');
            }

            const items = getAllContent();
            items.unshift({
                category: cat,
                title: title,
                desc: desc,
                links: links,
                image: tempContentImg
            });
            saveAllContent(items);

            // پاک کردن فرم
            document.getElementById('contentTitleInput').value = '';
            document.getElementById('contentDescInput').value = '';
            document.getElementById('linksContainer').innerHTML = `
                <div class="link-row">
                    <input type="text" class="link-name" placeholder="نام لینک">
                    <input type="url" class="link-url" placeholder="لینک">
                    <button class="act-btn del-btn" style="padding:10px 12px;" onclick="this.parentElement.remove()">×</button>
                </div>
            `;
            tempContentImg = null;
            document.getElementById('contentImgStatus').textContent = '';

            renderAllContent();
            document.getElementById('publishMsg').textContent = '✅ منتشر شد!';
            setTimeout(() => document.getElementById('publishMsg').textContent = '', 3000);
        }

        // === اجرا ===
        init();
    </script>
</body>
</html>
