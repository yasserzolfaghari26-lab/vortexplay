<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VORTEXPLAY 🎮 نامحدود</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:tahoma,sans-serif}
:root{--نارنجی:#FF6B00;--آبی:#0099FF;--تیره:#050508;--خاکستری:#12121f;--قرمز:#FF4444;--سبز:#00CC66}
body{background:var(--تیره);color:#fff;min-height:100vh;padding:20px}
.container{max-width:450px;margin:0 auto}
.header{text-align:center;padding:25px 0}
h1{font-size:28px;background:linear-gradient(90deg,var(--آبی),var(--نارنجی));-webkit-background-clip:text;color:transparent}
.sub{color:#777;margin-top:8px}
.box{background:var(--خاکستری);border-radius:16px;padding:25px;border:1px solid #222;margin-top:15px}
.textarea{width:100%;padding:15px;background:#1a1a2e;border:1px solid #333;border-radius:10px;color:#fff;font-size:16px;min-height:100px;resize:none;margin:10px 0}
.textarea:focus{outline:none;border-color:var(--نارنجی)}
.btn{width:100%;padding:14px;margin-top:10px;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;transition:.2s}
.btn-اصلی{background:linear-gradient(90deg,var(--نارنجی),var(--آبی));color:#fff}
.btn-پنل{background:transparent;border:1px solid var(--آبی);color:var(--آبی)}
.btn-حذف{background:var(--قرمز);color:#fff}
.msg{background:#1a1a2e;border-radius:10px;padding:15px;margin-top:12px;border-right:3px solid var(--نارنجی)}
.زمان{font-size:11px;color:#666;margin-top:8px}
.خالی{text-align:center;color:#555;padding:30px}
h3{color:var(--نارنجی);margin:20px 0 10px}
.مخفی{display:none}
.ورودی{width:100%;padding:14px;background:#1a1a2e;border:1px solid #333;border-radius:10px;color:#fff;font-size:16px;margin-bottom:10px}
.ورودی:focus{outline:none;border-color:var(--نارنجی)}
.پیام{margin-top:10px;text-align:center;display:none}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎮 VORTEXPLAY</h1>
    <p class="sub">سایت نامحدود — فقط با گیت‌هاب ✅</p>
  </div>

  <!-- صفحه اصلی -->
  <div id="صفحه-اصلی">
    <div class="box">
      <textarea id="ورودی" class="textarea" placeholder="پیامت رو بنویس..."></textarea>
      <button class="btn btn-اصلی" onclick="ارسال()">📤 ارسال پیام</button>
      <p id="موفق" class="پیام" style="color:var(--سبز)">✅ پیام فرستاده شد!</p>
      
      <h3>📋 پیام‌ها</h3>
      <div id="لیست"></div>
      
      <button class="btn btn-پنل" onclick="باز_پنل()">🔐 ورود به پنل مدیریت</button>
    </div>
  </div>

  <!-- صفحه ورود -->
  <div id="صفحه-ورود" class="مخفی">
    <div class="box">
      <h3>🔐 ورود به پنل</h3>
      <input type="password" id="رمز" class="ورودی" placeholder="رمز عبور">
      <p id="خطا" class="پیام" style="color:var(--قرمز)">❌ رمز اشتباه است!</p>
      <button class="btn btn-اصلی" onclick="بررسی_رمز()">✅ ورود</button>
      <button class="btn btn-پنل" onclick="بازگشت()">بازگشت به صفحه اصلی</button>
    </div>
  </div>

  <!-- پنل مدیریت -->
  <div id="پنل-مدیریت" class="مخفی">
    <div class="box">
      <h3>🛠 پنل مدیریت</h3>
      <p style="color:var(--سبز);margin:10px 0">✅ وارد شدی!</p>
      <button class="btn btn-حذف" onclick="حذف_همه()">🗑 حذف همه پیام‌ها</button>
      <button class="btn btn-پنل" onclick="بازگشت()">بازگشت</button>
    </div>
  </div>
</div>

<script>
const رمز_پنل = '123456'; // رمز پنل - هرچی دوست داری عوض کن
const کلید_ذخیره = 'VORTEX_PAYAM_HA';

function بارگذاری_پیامها() {
  const پیامها = JSON.parse(localStorage.getItem(کلید_ذخیره) || '[]');
  const لیست = document.getElementById('لیست');
  
  if (!پیامها.length) {
    لیست.innerHTML = '<p class="خالی">هنوز پیامی نیست 😊 اولین پیام رو تو بفرست!</p>';
    return;
  }
  
  لیست.innerHTML = پیامها.map(p => `
    <div class="msg">
      <div>${p.متن.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>
      <div class="زمان">🕐 ${new Date(p.زمان).toLocaleString('fa-IR')}</div>
    </div>
  `).join('');
}

function ارسال() {
  const متن = document.getElementById('ورودی').value.trim();
  if (!متن) return;
  
  const پیامها = JSON.parse(localStorage.getItem(کلید_ذخیره) || '[]');
  پیامها.unshift({ متن, زمان: Date.now() });
  localStorage.setItem(کلید_ذخیره, JSON.stringify(پیامها));
  
  document.getElementById('ورودی').value = '';
  بارگذاری_پیامها();
  
  const پیام_موفق = document.getElementById('موفق');
  پیام_موفق.style.display = 'block';
  setTimeout(() => پیام_موفق.style.display = 'none', 2500);
}

function باز_پنل() {
  document.getElementById('صفحه-اصلی').classList.add('مخفی');
  document.getElementById('صفحه-ورود').classList.remove('مخفی');
  document.getElementById('خطا').style.display = 'none';
  document.getElementById('رمز').value = '';
}

function بررسی_رمز() {
  const وارد_شده = document.getElementById('رمز').value;
  if (وارد_شده === رمز_پنل) {
    document.getElementById('صفحه-ورود').classList.add('مخفی');
    document.getElementById('پنل-مدیریت').classList.remove('مخفی');
  } else {
    document.getElementById('خطا').style.display = 'block';
    setTimeout(() => document.getElementById('خطا').style.display = 'none', 2500);
  }
}

function حذف_همه() {
  if (confirm('مطمئنی همه پیام‌ها حذف بشن؟ این عمل بازگشت‌ناپذیره!')) {
    localStorage.removeItem(کلید_ذخیره);
    بارگذاری_پیامها();
    alert('✅ همه پیام‌ها حذف شدن!');
    بازگشت();
  }
}

function بازگشت() {
  document.getElementById('صفحه-ورود').classList.add('مخفی');
  document.getElementById('پنل-مدیریت').classList.add('مخفی');
  document.getElementById('صفحه-اصلی').classList.remove('مخفی');
}

// اجرای اولیه
بارگذاری_پیامها();
</script>
</body>
</html>
