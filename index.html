<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEXPLAY</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        :root {
            --gold: #FFD700;
            --gold-light: #FFF176;
            --gold-dark: #B8860B;
            --bg-main: #0F0C1A;
            --bg-card: #1A1630;
            --bg-bubble: #242042;
            --text: #F8F8FF;
            --text-dim: #B0B0D0;
        }

        body {
            background: linear-gradient(135deg, #0F0C1A 0%, #1A1630 50%, #0F0C1A 100%);
            color: var(--text);
            min-height: 100vh;
        }

        .container { max-width: 480px; margin: 0 auto; padding: 25px 20px 40px; }

        /* === سرصفحه === */
        .header { text-align: center; margin-bottom: 30px; }
        .logo-ring {
            width: 120px; height: 120px; margin: 0 auto 15px; border-radius: 50%;
            background: linear-gradient(45deg, var(--gold), var(--gold-dark), var(--gold));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.35);
        }
        .logo-inner {
            width: 108px; height: 108px; border-radius: 50%; background: var(--bg-main);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .logo-text { font-size: 28px; font-weight: 900; color: var(--gold); }
        .site-title { font-size: 26px; font-weight: 900; color: var(--gold); margin-bottom: 5px; }
        .site-desc { color: var(--text-dim); font-size: 14px; }

        .status-bar {
            background: rgba(255, 215, 0, 0.08); border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: 50px; padding: 10px 20px; margin-bottom: 25px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .status-dot {
            width: 10px; height: 10px; border-radius: 50%; background: #00FF88;
            box-shadow: 0 0 8px #00FF88; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

        /* === کارت دسته‌بندی === */
        .cat-card {
            background: var(--bg-card); border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px; padding: 20px; margin-bottom: 14px; cursor: pointer;
            transition: 0.3s;
        }
        .cat-card:hover {
            transform: translateY(-2px); border-color: var(--gold);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.15);
        }
        .cat-name { font-size: 18px; font-weight: 800; color: var(--gold); margin-bottom: 6px; }
        .cat-desc { font-size: 13px; color: var(--text-dim); }

        .admin-btn {
            width: 100%; margin-top: 30px; padding: 14px;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold));
            border: none; border-radius: 12px; color: #000; font-weight: 800; font-size: 15px; cursor: pointer;
        }

        /* === صفحه پیام‌ها === */
        .msg-page {
            position: fixed; inset: 0; background: var(--bg-main); z-index: 100;
            display: none; flex-direction: column;
        }
        .msg-page.active { display: flex; }
        .page-head {
            background: var(--bg-card); padding: 15px 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }
        .back-btn {
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255, 215, 0, 0.1); border: none;
            color: var(--gold); font-size: 16px; cursor: pointer;
        }
        .page-name { font-size: 17px; font-weight: 800; color: var(--gold); }
        .msgs-box { flex: 1; overflow-y: auto; padding: 20px; }
        .msg-bubble {
            background: var(--bg-bubble); border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 14px; padding: 14px 16px; margin-bottom: 12px;
            line-height: 1.7;
        }
        .empty { text-align: center; color: var(--text-dim); padding: 60px 20px; }

        /* === مودال ورود === */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200;
            display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-box {
            width: 100%; max-width: 400px; background: var(--bg-card);
            border: 2px solid var(--gold-dark); border-radius: 20px; padding: 25px;
        }
        .modal-title { font-size: 20px; font-weight: 900; color: var(--gold); text-align: center; margin-bottom: 20px; }
        .input {
            width: 100%; padding: 13px 15px; margin-bottom: 12px;
            background: var(--bg-main); border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: 10px; color: #fff; font-size: 15px;
        }
        .input:focus { outline: none; border-color: var(--gold); }
        .btn {
            width: 100%; padding: 13px; border: none; border-radius: 10px;
            font-weight: 800; font-size: 15px; cursor: pointer; margin-top: 5px;
        }
        .btn-gold { background: linear-gradient(90deg, var(--gold-dark), var(--gold)); color: #000; }
        .btn-red { background: linear-gradient(90deg, #8B0000, #DC143C); color: #fff; }
        .btn-green { background: linear-gradient(90deg, #006400, #228B22); color: #fff; }
        .err { color: #FF6B6B; text-align: center; margin-top: 10px; display: none; }

        /* === پنل مدیریت === */
        .panel {
            position: fixed; inset: 0; background: var(--bg-main); z-index: 300;
            display: none; overflow-y: auto;
        }
        .panel.active { display: block; }
        .panel-wrap { max-width: 480px; margin: 0 auto; padding: 25px 20px 50px; }
        .panel-head {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }
        .panel-title { font-size: 22px; font-weight: 900; color: var(--gold); }
        .close-panel {
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255, 215, 0, 0.1); border: none;
            color: var(--gold); font-size: 18px; cursor: pointer;
        }
        .section { margin-bottom: 30px; }
        .sec-title { font-size: 16px; font-weight: 800; color: var(--gold); margin-bottom: 12px; }
        .item {
            background: var(--bg-card); border-radius: 10px; padding: 14px; margin-bottom: 10px;
        }
        .note {
            margin-top: 12px; padding: 10px; background: rgba(0,255,136,0.1);
            border: 1px solid rgba(0,255,136,0.3); border-radius: 8px;
            color: #00FF88; text-align: center; display: none;
        }
        label { font-size: 14px; color: var(--text-dim); margin-bottom: 6px; display: block; }
        select, textarea { resize: vertical; min-height: 100px; }
    </style>
</head>
<body>
    <!-- صفحه اصلی -->
    <div class="container" id="mainPage">
        <div class="header">
            <div class="logo-ring">
                <div class="logo-inner">
                    <span class="logo-text">VP</span>
                </div>
            </div>
            <h1 class="site-title">VORTEXPLAY</h1>
            <p class="site-desc">پایگاه گیمینگ شما</p>
        </div>

        <div class="status-bar">
            <span class="status-dot"></span>
            <span>سیستم فعال است</span>
        </div>

        <div id="catsList"></div>

        <button class="admin-btn" id="openPanelBtn">
            <i class="fas fa-cog"></i> پنل مدیریت
        </button>
    </div>

    <!-- صفحه پیام‌ها -->
    <div class="msg-page" id="msgPage">
        <div class="page-head">
            <button class="back-btn" id="backBtn"><i class="fas fa-arrow-right"></i></button>
            <h2 class="page-name" id="pageTitle"></h2>
            <div></div>
        </div>
        <div class="msgs-box" id="msgsBox"></div>
    </div>

    <!-- مودال ورود -->
    <div class="modal" id="loginModal">
        <div class="modal-box">
            <h2 class="modal-title">ورود به پنل مدیریت</h2>
            <input type="password" class="input" id="passInput" placeholder="رمز ۳۲ رقمی" maxlength="32">
            <p class="err" id="passErr">رمز نادرست است!</p>
            <button class="btn btn-gold" id="loginBtn">ورود</button>
        </div>
    </div>

    <!-- پنل مدیریت -->
    <div class="panel" id="adminPanel">
        <div class="panel-wrap">
            <div class="panel-head">
                <h2 class="panel-title">پنل مدیریت</h2>
                <button class="close-panel" id="closePanelBtn"><i class="fas fa-times"></i></button>
            </div>

            <!-- بخش: ارسال پیام -->
            <div class="section">
                <h3 class="sec-title">📤 ارسال پیام</h3>
                <label>انتخاب دسته</label>
                <select class="input" id="targetCat"></select>
                <label>متن پیام</label>
                <textarea class="input" id="msgText" placeholder="متن پیام خود را بنویسید..."></textarea>
                <button class="btn btn-gold" id="sendBtn">ارسال پیام</button>
                <p class="note" id="msgNote">✅ پیام ارسال شد!</p>
            </div>

            <!-- بخش: دسته‌بندی‌ها -->
            <div class="section">
                <h3 class="sec-title">📂 مدیریت دسته‌بندی‌ها</h3>
                <div id="panelCats"></div>
                <label>نام دسته جدید</label>
                <input type="text" class="input" id="newCatName" placeholder="مثال: بازی‌های کامپیوتر">
                <label>توضیح کوتاه</label>
                <input type="text" class="input" id="newCatDesc" placeholder="مثال: دانلود بازی‌های کامپیوتر">
                <button class="btn btn-green" id="addCatBtn">افزودن دسته جدید</button>
                <p class="note" id="catNote">✅ دسته اضافه شد!</p>
            </div>
        </div>
    </div>

    <script>
        // === رمز ۳۲ رقمی ===
        const ADMIN_PASS = 'CECGAA0MMLOGOBYEIZXQUXKCFOJOKYFRTUJDXHRHDAOFCUXMUGXMMLGZBPSWWZGR';

        // === داده‌های اولیه ===
        let data = {
            categories: [
                { id: 1, name: 'بکاپ و آموزش', desc: 'فایل‌های پشتیبان و راهنماها', messages: [] },
                { id: 2, name: 'بازی‌های PS5', desc: 'دانلود بازی‌های پلی‌استیشن ۵', messages: [] },
                { id: 3, name: 'تصاویر و والپیپر', desc: 'تصاویر باکیفیت بازی‌ها', messages: [] }
            ]
        };

        // === ذخیره و بارگذاری ===
        function save() { localStorage.setItem('vortex', JSON.stringify(data)); }
        function load() {
            const s = localStorage.getItem('vortex');
            if (s) data = JSON.parse(s);
            renderMain();
        }
        function showNote(elId) {
            const e = document.getElementById(elId);
            e.style.display = 'block';
            setTimeout(() => e.style.display = 'none', 3000);
        }

        // === صفحه اصلی ===
        function renderMain() {
            const list = document.getElementById('catsList');
            list.innerHTML = '';
            data.categories.forEach((cat, idx) => {
                const card = document.createElement('div');
                card.className = 'cat-card';
                card.innerHTML = `
                    <h3 class="cat-name">${cat.name}</h3>
                    <p class="cat-desc">${cat.desc}</p>
                `;
                card.onclick = () => openPage(idx);
                list.appendChild(card);
            });
            renderPanelLists();
        }

        // === صفحه پیام‌ها ===
        function openPage(idx) {
            const cat = data.categories[idx];
            document.getElementById('pageTitle').textContent = cat.name;
            const box = document.getElementById('msgsBox');
            box.innerHTML = '';
            if (cat.messages.length === 0) {
                box.innerHTML = '<p class="empty">هنوز پیامی ارسال نشده</p>';
            } else {
                cat.messages.forEach(m => {
                    const b = document.createElement('div');
                    b.className = 'msg-bubble';
                    b.textContent = m;
                    box.appendChild(b);
                });
            }
            document.getElementById('msgPage').classList.add('active');
        }
        function closePage() {
            document.getElementById('msgPage').classList.remove('active');
        }

        // === لیست‌های پنل مدیریت ===
        function renderPanelLists() {
            const sel = document.getElementById('targetCat');
            sel.innerHTML = '';
            data.categories.forEach((c, i) => {
                const o = document.createElement('option');
                o.value = i; o.textContent = c.name;
                sel.appendChild(o);
            });

            const list = document.getElementById('panelCats');
            list.innerHTML = '';
            data.categories.forEach((c, i) => {
                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML = `
                    <div style="font-weight:700; color:var(--gold); margin-bottom:4px;">${c.name}</div>
                    <div style="font-size:13px; color:var(--text-dim); margin-bottom:8px;">${c.desc}</div>
                    <div style="font-size:12px; color:var(--text-dim);">تعداد پیام: ${c.messages.length}</div>
                    <button class="btn btn-red" data-i="${i}" style="margin-top:8px;">حذف این دسته</button>
                `;
                list.appendChild(item);
            });
            list.querySelectorAll('button.btn-red').forEach(b => {
                b.onclick = function() {
                    if (confirm('مطمئن هستید؟')) {
                        data.categories.splice(parseInt(this.dataset.i), 1);
                        save(); renderMain();
                    }
                };
            });
        }

        // === ورود و خروج ===
        function openLogin() {
            document.getElementById('loginModal').classList.add('active');
            document.getElementById('passInput').value = '';
            document.getElementById('passErr').style.display = 'none';
        }
        function checkLogin() {
            if (document.getElementById('passInput').value.trim() === ADMIN_PASS) {
                document.getElementById('loginModal').classList.remove('active');
                document.getElementById('adminPanel').classList.add('active');
                renderPanelLists();
            } else {
                document.getElementById('passErr').style.display = 'block';
            }
        }
        function closePanel() {
            document.getElementById('adminPanel').classList.remove('active');
        }

        // === اتصال همه رویدادها ===
        document.addEventListener('DOMContentLoaded', () => {
            load();

            document.getElementById('openPanelBtn').onclick = openLogin;
            document.getElementById('loginBtn').onclick = checkLogin;
            document.getElementById('closePanelBtn').onclick = closePanel;
            document.getElementById('backBtn').onclick = closePage;

            // ارسال پیام
            document.getElementById('sendBtn').onclick = () => {
                const i = parseInt(document.getElementById('targetCat').value);
                const t = document.getElementById('msgText').value.trim();
                if (!t) return alert('متن پیام را بنویسید!');
                data.categories[i].messages.push(t);
                document.getElementById('msgText').value = '';
                save(); renderMain();
                showNote('msgNote');
            };

            // افزودن دسته
            document.getElementById('addCatBtn').onclick = () => {
                const n = document.getElementById('newCatName').value.trim();
                const d = document.getElementById('newCatDesc').value.trim();
                if (!n) return alert('نام دسته را بنویسید!');
                data.categories.push({
                    id: Date.now(), name: n, desc: d || 'بدون توضیح', messages: []
                });
                document.getElementById('newCatName').value = '';
                document.getElementById('newCatDesc').value = '';
                save(); renderMain();
                showNote('catNote');
            };
        });
    </script>
</body>
</html>
