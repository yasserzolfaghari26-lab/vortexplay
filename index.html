<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VORTEXPLAY</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Rajdhani',sans-serif;min-height:100vh;color:#f5e6a3;overflow-x:hidden;
    background:radial-gradient(circle at 50% 0%,rgba(212,175,55,.25),transparent 60%),
               radial-gradient(circle at 20% 80%,rgba(75,0,130,.4),transparent 50%),
               linear-gradient(160deg,#0d0618 0%,#2d1b4e 45%,#1a0b2e 100%);
    background-attachment:fixed;transition:background .5s}
body.has-bg{background-size:cover;background-position:center}
header{position:relative;z-index:10;padding:40px 20px 20px;text-align:center}
.logo-ring{position:relative;display:inline-block;margin-bottom:20px}
.logo-ring::before{content:'';position:absolute;inset:-8px;border-radius:50%;
    background:conic-gradient(from 0deg,#ffd700,#b8860b,#fff2b0,#d4af37,#8b6914,#ffd700);
    animation:spin 5s linear infinite}
.logo-ring::after{content:'';position:absolute;inset:-8px;border-radius:50%;
    background:conic-gradient(from 0deg,#ffd700,#b8860b,#fff2b0,#d4af37,#8b6914,#ffd700);
    animation:spin 5s linear infinite;filter:blur(18px);opacity:.8}
@keyframes spin{to{transform:rotate(360deg)}}
.logo{position:relative;z-index:1;width:160px;height:160px;border-radius:50%;object-fit:cover;
    border:4px solid #ffd700;box-shadow:0 0 40px rgba(255,215,0,.5);background:#1a0b2e}
.crown{font-size:34px;display:block;margin-bottom:8px;filter:drop-shadow(0 0 15px #ffd700);animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
h1{font-family:'Cinzel',serif;font-size:clamp(30px,8vw,46px);letter-spacing:4px;font-weight:900;
    color:#ffd700;text-shadow:0 0 20px #ffd700,0 0 40px rgba(255,215,0,.3)}
.sub{font-size:14px;letter-spacing:3px;margin:10px 0 25px;color:#d4af37}
.hero{width:95%;max-width:440px;border-radius:20px;margin:0 auto 35px;display:block;
    border:4px solid #ffd700;box-shadow:0 0 40px rgba(255,215,0,.4),0 15px 50px rgba(0,0,0,.5)}
.menu{max-width:550px;margin:0 auto;padding:0 20px 50px;display:grid;grid-template-columns:repeat(2,1fr);gap:20px;position:relative;z-index:10}
.bw{border-radius:18px;padding:3px;background:conic-gradient(from 0deg,#ffd700,#b8860b,#fff2b0,#d4af37,#8b6914,#ffd700);animation:hue 6s linear infinite;box-shadow:0 5px 25px rgba(255,215,0,.25)}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 15px;
    border-radius:16px;text-decoration:none;color:#f5e6a3;
    background:rgba(26,11,46,.8);backdrop-filter:blur(12px);
    border:2px solid rgba(255,215,0,.5);transition:.3s;cursor:pointer}
.btn:active{transform:scale(.95)}
.btn:hover{background:rgba(45,27,78,.9);box-shadow:inset 0 0 30px rgba(255,215,0,.2)}
.btn .ic{font-size:42px;margin-bottom:8px;filter:drop-shadow(0 0 12px #ffd700)}
.btn .nm{font-family:'Cinzel',serif;font-size:14px;font-weight:700;letter-spacing:1px;color:#ffd700}
.adm{display:block;text-align:center;margin-top:25px;color:#d4af37;text-decoration:none;font-size:12px;letter-spacing:2px;opacity:.8;cursor:pointer}
.fx{position:fixed;width:40px;height:40px;border:3px solid #ffd700;background:rgba(255,255,255,.95);
    border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%) scale(0);
    animation:rip .6s ease-out forwards;box-shadow:0 0 20px rgba(255,215,0,.8)}
@keyframes rip{0%{transform:translate(-50%,-50%) scale(0);opacity:1}100%{transform:translate(-50%,-50%) scale(3);opacity:0}}

/* Modal */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;overflow-y:auto;padding:20px}
.modal.active{display:block}
.modal-content{max-width:720px;margin:20px auto;background:linear-gradient(160deg,#0d0618,#2d1b4e,#1a0b2e);
    border:2px solid rgba(255,215,0,.4);border-radius:18px;padding:25px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;
    padding-bottom:15px;border-bottom:2px solid rgba(255,215,0,.3)}
.modal-title{font-family:'Cinzel',serif;color:#ffd700;font-size:20px}
.close-btn{background:linear-gradient(135deg,#ff0066,#ffd700);color:#1a0b2e;border:none;
    padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:700;font-family:'Cinzel',serif}

/* Cards */
.card{background:rgba(26,11,46,.75);backdrop-filter:blur(10px);border:2px solid rgba(255,215,0,.4);
    border-radius:16px;padding:16px;margin-bottom:15px}
.card img{width:100%;height:190px;object-fit:cover;border-radius:12px;margin-bottom:10px;border:2px solid #ffd700}
.card h3{font-family:'Cinzel',serif;font-size:16px;margin-bottom:6px;color:#ffd700}
.card p{font-size:13px;line-height:1.8;margin-bottom:10px;color:#e8d9a0}
.dl{display:inline-block;padding:10px 20px;border-radius:10px;background:linear-gradient(135deg,#ffd700,#b8860b);
    color:#1a0b2e;text-decoration:none;font-family:'Cinzel',serif;font-weight:700;font-size:12px}
.empty{text-align:center;padding:40px 20px;color:#d4af37}
.empty .big{font-size:55px;display:block;margin-bottom:12px}

/* Forms */
.form-group{margin-bottom:15px}
label{display:block;color:#d4af37;font-size:13px;margin-bottom:5px}
input,select,textarea{width:100%;padding:11px;border:2px solid rgba(255,215,0,.3);border-radius:8px;
    background:rgba(13,6,24,.7);color:#f5e6a3;font-size:14px;font-family:inherit}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:#ffd700}
.btn-submit{background:linear-gradient(90deg,#ffd700,#b8860b);color:#1a0b2e;border:none;padding:12px 22px;
    border-radius:10px;font-weight:800;font-size:14px;cursor:pointer;width:100%;font-family:'Cinzel',serif}
.btn-submit:hover{opacity:.9}
.btn-danger{background:linear-gradient(90deg,#ff0044,#ff0066);color:#fff}

/* Login */
.login-card{max-width:360px;margin:80px auto;text-align:center;padding:35px;
    background:rgba(26,11,46,.9);border:2px solid rgba(255,215,0,.5);border-radius:18px}
.login-card .crown{font-size:45px}
.err{color:#ff5577;font-size:13px;margin-bottom:12px}

/* Admin */
.admin-sec{background:rgba(26,11,46,.8);border:2px solid rgba(255,215,0,.35);border-radius:14px;padding:20px;margin-bottom:20px}
.admin-sec h2{color:#ffd700;font-size:17px;margin-bottom:14px;font-family:'Cinzel',serif}
.admin-item{background:rgba(13,6,24,.6);border:1px solid rgba(255,215,0,.25);border-radius:10px;padding:12px;
    margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.preview{max-width:120px;max-height:120px;border-radius:10px;border:2px solid #ffd700;margin-top:10px}

@media(max-width:450px){.menu{grid-template-columns:1fr}.logo{width:130px;height:130px}}
</style>
</head>
<body>

<!-- صفحه اصلی -->
<div id="mainPage">
<header>
<span class="crown">👑</span>
<div class="logo-ring">
<img id="logoImg" class="logo" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231a0b2e' width='100' height='100'/><text x='50' y='55' font-size='40' text-anchor='middle' fill='%23ffd700' font-family='serif'>VP</text></svg>">
</div>
<h1 id="titleText">VORTEXPLAY</h1>
<div class="sub" id="subtitleText">✦ ROYAL GAMING EMPIRE ✦</div>
<img id="heroImg" class="hero" style="display:none">
</header>
<main class="menu" id="menuGrid"></main>
<a class="adm" onclick="showLogin()">⚙️ پنل مدیریت</a>
</div>

<!-- Modal دسته‌بندی -->
<div class="modal" id="catModal">
<div class="modal-content">
<div class="modal-header">
<div class="modal-title" id="catTitle"></div>
<button class="close-btn" onclick="closeModal('catModal')">✕</button>
</div>
<div id="catItems"></div>
</div>
</div>

<!-- Modal ورود -->
<div class="modal" id="loginModal">
<div class="login-card">
<span class="crown">👑</span>
<h2 style="font-family:'Cinzel',serif;color:#ffd700;margin-bottom:22px">ورود به پنل</h2>
<div class="err" id="loginErr" style="display:none">❌ رمز اشتباه است!</div>
<input type="password" id="passInput" placeholder="رمز ۳۲ رقمی" style="text-align:center;letter-spacing:2px">
<button class="btn-submit" onclick="doLogin()" style="margin-top:12px">🔓 ورود</button>
<button class="btn-submit" onclick="closeModal('loginModal')" style="margin-top:8px;background:rgba(255,255,255,.1);color:#d4af37">انصراف</button>
</div>
</div>

<!-- Modal مدیریت -->
<div class="modal" id="adminModal">
<div class="modal-content">
<div class="modal-header">
<div class="modal-title">👑 پنل مدیریت</div>
<button class="close-btn" onclick="closeAdmin()">✕</button>
</div>

<div class="admin-sec">
<h2>📝 متن‌ها</h2>
<div class="form-group"><label>عنوان سایت</label><input id="setTitle" type="text"></div>
<div class="form-group"><label>زیرعنوان</label><input id="setSubtitle" type="text"></div>
<button class="btn-submit" onclick="saveTexts()">💾 ذخیره متن‌ها</button>
</div>

<div class="admin-sec">
<h2>🖼️ تصاویر (از گالری)</h2>
<div class="form-group"><label>لوگو</label><input type="file" id="logoFile" accept="image/*" onchange="uploadImg('logo')"></div>
<img id="logoPreview" class="preview" style="display:none">
<div class="form-group" style="margin-top:15px"><label>کاور بزرگ وسط</label><input type="file" id="heroFile" accept="image/*" onchange="uploadImg('hero')"></div>
<img id="heroPreview" class="preview" style="display:none">
<div class="form-group" style="margin-top:15px"><label>پس‌زمینه کل سایت</label><input type="file" id="bgFile" accept="image/*" onchange="uploadImg('bg')"></div>
<button class="btn-submit btn-danger" onclick="resetImages()" style="margin-top:10px">🗑 حذف همه تصاویر</button>
</div>

<div class="admin-sec">
<h2>📂 مدیریت دسته‌بندی‌ها</h2>
<div class="form-group"><label>نام دسته‌بندی جدید</label><input id="newCat" placeholder="مثلاً: اخبار"></div>
<div class="form-group"><label>آیکون</label><input id="newCatIcon" placeholder="📰" maxlength="2"></div>
<button class="btn-submit" onclick="addCat()">➕ افزودن دسته</button>
<div style="margin-top:15px" id="catList"></div>
</div>

<div class="admin-sec">
<h2>➕ افزودن پیام / آیتم</h2>
<div class="form-group"><label>دسته‌بندی</label><select id="msgCat"></select></div>
<div class="form-group"><label>عنوان</label><input id="msgTitle" type="text"></div>
<div class="form-group"><label>توضیحات</label><textarea id="msgDesc"></textarea></div>
<div class="form-group"><label>لینک دانلود (اختیاری)</label><input id="msgLink" type="url" placeholder="https://..."></div>
<div class="form-group"><label>عکس کاور (اختیاری)</label><input type="file" id="msgCover" accept="image/*"></div>
<button class="btn-submit" onclick="addMessage()">➕ افزودن</button>
</div>

<div class="admin-sec">
<h2>📋 همه پیام‌ها</h2>
<div id="allMsgs"></div>
</div>

<button class="btn-submit btn-danger" onclick="logoutAdmin()" style="margin-top:15px">🚪 خروج از پنل</button>
</div>
</div>

<script>
// ===== داده‌ها =====
const ADMIN_PASS='CECGAA0MMLOGOBYEIZXQUXKCFOJOKYFRTUJDXHRHDAOFCUXMUGXMMLGZBPSWWZGR';
let data=JSON.parse(localStorage.getItem('vortex_data'))||{
    title:'VORTEXPLAY',
    subtitle:'ROYAL GAMING EMPIRE',
    logo:'',
    hero:'',
    bg:'',
    categories:[
        {name:'payload',display:'PAYLOAD',icon:'👑'},
        {name:'backup',display:'BACKUP & آموزش',icon:'💾'},
        {name:'game',display:'GAME',icon:'🎮'},
        {name:'gallery',display:'عکس‌های بازی',icon:'🖼️'}
    ],
    messages:[]
};
let isAdmin=false;

function save(){localStorage.setItem('vortex_data',JSON.stringify(data));}

// ===== رندر صفحه اصلی =====
function render(){
    document.getElementById('titleText').textContent=data.title;
    document.getElementById('subtitleText').textContent='✦ '+data.subtitle+' ✦';
    
    if(data.logo){document.getElementById('logoImg').src=data.logo;}
    if(data.hero){
        const h=document.getElementById('heroImg');
        h.src=data.hero;h.style.display='block';
    }
    if(data.bg){
        document.body.style.backgroundImage=`url(${data.bg})`;
        document.body.classList.add('has-bg');
    }
    
    const grid=document.getElementById('menuGrid');
    grid.innerHTML='';
    data.categories.forEach(c=>{
        const count=data.messages.filter(m=>m.cat===c.name).length;
        grid.innerHTML+=`
        <div class="bw"><div class="btn" onclick="openCat('${c.name}')">
            <div class="ic">${c.icon}</div>
            <div class="nm">${c.display}</div>
            <div style="color:#d4af37;font-size:12px;margin-top:5px">(${count} آیتم)</div>
        </div></div>`;
    });
}

// ===== Modal دسته‌بندی =====
function openCat(name){
    const c=data.categories.find(x=>x.name===name);
    if(!c)return;
    document.getElementById('catTitle').textContent=`${c.icon} ${c.display}`;
    const msgs=data.messages.filter(m=>m.cat===name);
    const box=document.getElementById('catItems');
    if(!msgs.length){
        box.innerHTML='<div class="empty"><span class="big">👑</span>هنوز پیامی نیست!</div>';
    }else{
        box.innerHTML=msgs.map(m=>`
            <div class="card">
                ${m.cover?`<img src="${m.cover}">`:''}
                <h3>${m.title}</h3>
                ${m.desc?`<p>${m.desc}</p>`:''}
                ${m.link?`<a href="${m.link}" target="_blank" class="dl">⬇️ دانلود</a>`:''}
            </div>
        `).join('');
    }
    document.getElementById('catModal').classList.add('active');
}

function closeModal(id){document.getElementById(id).classList.remove('active');}

// ===== ورود =====
function showLogin(){
    if(isAdmin){openAdmin();return;}
    document.getElementById('loginErr').style.display='none';
    document.getElementById('passInput').value='';
    document.getElementById('loginModal').classList.add('active');
}

function doLogin(){
    const p=document.getElementById('passInput').value;
    if(p===ADMIN_PASS){
        isAdmin=true;
        closeModal('loginModal');
        openAdmin();
    }else{
        document.getElementById('loginErr').style.display='block';
    }
}

// ===== پنل مدیریت =====
function openAdmin(){
    document.getElementById('setTitle').value=data.title;
    document.getElementById('setSubtitle').value=data.subtitle;
    
    if(data.logo){
        const p=document.getElementById('logoPreview');
        p.src=data.logo;p.style.display='block';
    }
    if(data.hero){
        const p=document.getElementById('heroPreview');
        p.src=data.hero;p.style.display='block';
    }
    
    // لیست دسته‌ها
    const catList=document.getElementById('catList');
    catList.innerHTML=data.categories.map((c,i)=>`
        <div class="admin-item">
            <span>${c.icon} ${c.display} (${data.messages.filter(m=>m.cat===c.name).length} آیتم)</span>
            <button class="btn-submit btn-danger" onclick="deleteCat(${i})" style="width:auto;padding:6px 12px">🗑</button>
        </div>
    `).join('');
    
    // select دسته برای افزودن پیام
    const sel=document.getElementById('msgCat');
    sel.innerHTML=data.categories.map(c=>`<option value="${c.name}">${c.icon} ${c.display}</option>`).join('');
    
    // همه پیام‌ها
    const allBox=document.getElementById('allMsgs');
    if(!data.messages.length){
        allBox.innerHTML='<p style="color:#d4af37;text-align:center">هنوز پیامی نیست</p>';
    }else{
        allBox.innerHTML=data.messages.map((m,i)=>{
            const cat=data.categories.find(c=>c.name===m.cat);
            return `<div class="admin-item">
                <span>${cat?cat.icon:''} ${m.title}</span>
                <button class="btn-submit btn-danger" onclick="deleteMsg(${i})" style="width:auto;padding:6px 12px">🗑</button>
            </div>`;
        }).join('');
    }
    
    document.getElementById('adminModal').classList.add('active');
}

function closeAdmin(){closeModal('adminModal');}
function logoutAdmin(){isAdmin=false;closeAdmin();alert('خروج موفق');}

function saveTexts(){
    data.title=document.getElementById('setTitle').value||'VORTEXPLAY';
    data.subtitle=document.getElementById('setSubtitle').value||'ROYAL GAMING EMPIRE';
    save();render();alert('✅ ذخیره شد');
}

// ===== آپلود تصویر =====
function uploadImg(type){
    const fileInput={logo:'logoFile',hero:'heroFile',bg:'bgFile'}[type];
    const file=document.getElementById(fileInput).files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=e=>{
        data[type]=e.target.result;
        save();render();
        if(type==='logo'){
            const p=document.getElementById('logoPreview');
            p.src=data.logo;p.style.display='block';
        }
        if(type==='hero'){
            const p=document.getElementById('heroPreview');
            p.src=data.hero;p.style.display='block';
        }
        alert('✅ آپلود شد');
    };
    reader.readAsDataURL(file);
}

function resetImages(){
    if(!confirm('مطمئنی همه تصاویر حذف بشن؟'))return;
    data.logo='';data.hero='';data.bg='';
    save();render();
    document.body.style.backgroundImage='';
    document.body.classList.remove('has-bg');
    document.getElementById('logoPreview').style.display='none';
    document.getElementById('heroPreview').style.display='none';
    alert('🗑 حذف شد');
}

// ===== دسته‌بندی‌ها =====
function addCat(){
    const name=document.getElementById('newCat').value.trim();
    const icon=document.getElementById('newCatIcon').value.trim()||'📁';
    if(!name){alert('نام را وارد کن');return;}
    const safe=name.toLowerCase().replace(/[^a-z0-9]/g,'_');
    if(data.categories.find(c=>c.name===safe)){alert('این نام تکراری است');return;}
    data.categories.push({name:safe,display:name,icon:icon});
    save();render();openAdmin();
    document.getElementById('newCat').value='';
    document.getElementById('newCatIcon').value='';
}

function deleteCat(i){
    if(!confirm(`حذف "${data.categories[i].display}" و همه پیام‌هایش؟`))return;
    const catName=data.categories[i].name;
    data.categories.splice(i,1);
    data.messages=data.messages.filter(m=>m.cat!==catName);
    save();render();openAdmin();
}

// ===== پیام‌ها =====
function addMessage(){
    const cat=document.getElementById('msgCat').value;
    const title=document.getElementById('msgTitle').value.trim();
    const desc=document.getElementById('msgDesc').value.trim();
    const link=document.getElementById('msgLink').value.trim();
    const coverFile=document.getElementById('msgCover').files[0];
    
    if(!title){alert('عنوان را وارد کن');return;}
    
    const add=(cover)=>{
        data.messages.push({cat,title,desc,link,cover,date:Date.now()});
        save();render();openAdmin();
        document.getElementById('msgTitle').value='';
        document.getElementById('msgDesc').value='';
        document.getElementById('msgLink').value='';
        document.getElementById('msgCover').value='';
        alert('✅ اضافه شد');
    };
    
    if(coverFile){
        const r=new FileReader();
        r.onload=e=>add(e.target.result);
        r.readAsDataURL(coverFile);
    }else{
        add('');
    }
}

function deleteMsg(i){
    if(!confirm('حذف این پیام؟'))return;
    data.messages.splice(i,1);
    save();render();openAdmin();
}

// ===== افکت کلیک =====
document.addEventListener('click',e=>{
    if(e.target.closest('input,button,select,textarea,.adm'))return;
    const r=document.createElement('div');
    r.className='fx';
    r.style.left=e.clientX+'px';
    r.style.top=e.clientY+'px';
    document.body.appendChild(r);
    setTimeout(()=>r.remove(),600);
});

// ===== اجرای اولیه =====
render();
</script>
</body>
</html>
