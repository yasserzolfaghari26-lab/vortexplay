<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEXPLAY | تم آبی</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif;}

        :root {
            --blue-deep: #001F3F;
            --blue-main: #0077FF;
            --blue-light: #00BFFF;
            --blue-sky: #87CEEB;
            --blue-glow: rgba(0, 191, 255, 0.5);
            --bg-card: rgba(0, 50, 100, 0.75);
            --text-light: #FFFFFF;
            --text-dim: #B0D0F0;
        }

        body {
            background: linear-gradient(135deg, #001F3F, #003366, #004488);
            color: var(--text-light);
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: all 0.5s ease;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(0,119,255,0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0,191,255,0.12) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {max-width: 900px; margin: 0 auto; padding: 30px 20px; position: relative; z-index: 1;}

        /* === کاور === */
        .cover {
            width: 100%; height: 220px; border-radius: 20px; overflow: hidden;
            margin-bottom: -70px; position: relative; z-index: 2;
            box-shadow: 0 0 30px rgba(0,119,255,0.4), inset 0 0 40px rgba(0,0,0,0.4);
            border: 2px solid rgba(0,191,255,0.3);
        }
        .cover img {width: 100%; height: 100%; object-fit: cover;}

        /* === لوگو با نور آبی === */
        .logo-wrap {
            width: 150px; height: 150px; margin: 0 auto; border-radius: 50%;
            background: #001F3F; display: flex; align-items: center; justify-content: center;
            position: relative; z-index: 3;
            box-shadow: 
                0 0 0 4px var(--blue-light),
                0 0 30px rgba(0,191,255,0.6),
                0 0 50px rgba(0,119,255,0.4);
            animation: bluePulse 3s ease-in-out infinite alternate;
        }
        @keyframes bluePulse {
            from {
                box-shadow: 0 0 0 4px var(--blue-light), 0 0 30px rgba(0,191,255,0.6);
            }
            to {
                box-shadow: 0 0 0 4px var(--blue-main), 0 0 40px rgba(0,119,255,0.8), 0 0 60px rgba(0,191,255,0.4);
            }
        }
        .logo-wrap img {width: 125px; height: 125px; border-radius: 50%; object-fit: cover; border: 3px solid var(--blue-light);}

        header {text-align: center; padding: 20px 0 35px;}
        h1 {font-size: 2.6rem; color: var(--blue-light); text-shadow: 0 0 20px rgba(0,191,255,0.6); margin: 15px 0 8px;}
        .desc {color: var(--text-dim); font-size: 1.1rem;}

        .divider {
            height: 3px; border: none;
            background: linear-gradient(90deg, transparent, var(--blue-light), var(--blue-main), var(--blue-light), transparent);
            margin: 30px 0; border-radius: 2px;
            box-shadow: 0 0 15px rgba(0,191,255,0.4);
        }

        /* === دسته‌بندی === */
        .cats {display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 30px;}
        .cat {
            padding: 12px 24px; background: var(--bg-card); border-radius: 50px; cursor: pointer;
            color: var(--text-dim); border: 2px solid transparent; transition: 0.3s;
            backdrop-filter: blur(10px);
        }
        .cat:hover, .cat.active {
            border-color: var(--blue-light); color: var(--blue-sky);
            box-shadow: 0 0 20px rgba(0,191,255,0.4); transform: translateY(-2px);
            background: rgba(0,119,255,0.15);
        }

        /* === کارت محتوا === */
        .card {
            background: var(--bg-card); border-radius: 18px; padding: 22px; margin-bottom: 18px;
            border: 2px solid rgba(0,191,255,0.2); transition: 0.3s;
            backdrop-filter: blur(10px);
        }
        .card:hover {
            border-color: var(--blue-light); box-shadow: 0 0 30px rgba(0,191,255,0.25);
            transform: translateY(-4px);
        }
        .card-img {width: 100%; height: 180px; border-radius: 12px; object-fit: cover; margin-bottom: 15px; background: linear-gradient(135deg, var(--blue-deep), var(--blue-light));}
        .card h3 {color: var(--blue-sky); margin-bottom: 8px; font-size: 1.3rem;}
        .card p {color: var(--text-dim); margin-bottom: 15px; line-height: 1.8;}
        
        /* لینک‌های دانلود نامحدود */
        .download-link {
            display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px;
            background: linear-gradient(135deg, #0077FF, #00BFFF, #00CCFF);
            color: white; border-radius: 8px; text-decoration: none; font-weight: bold;
            margin: 6px; transition: 0.3s; box-shadow: 0 0 12px rgba(0,191,255,0.4);
        }
        .download-link:hover {transform: scale(1.05); box-shadow: 0 0 25px rgba(0,191,255,0.7);}

        /* === پنل مدیریت === */
        .admin-link {text-align: center; margin-top: 50px;}
        .admin-btn {
            padding: 14px 40px; background: transparent; border: 2px solid var(--blue-light);
            color: var(--blue-sky); border-radius: 12px; font-weight: bold; cursor: pointer;
            transition: 0.3s; font-size: 1.05rem;
        }
        .admin-btn:hover {
            background: var(--blue-main); color: white; 
            box-shadow: 0 0 25px rgba(0,191,255,0.5); transform: scale(1.03);
        }

        .panel {background: var(--bg-card); border-radius: 24px; padding: 28px; border: 2px solid rgba(0,191,255,0.3); margin-top: 25px; backdrop-filter: blur(15px);}
        .back {color: var(--blue-light); text-decoration: none; display: inline-block; margin-bottom: 20px; font-weight: bold;}
        
        .panel-tabs {display: flex; gap: 12px; margin-bottom: 30px;}
        .tab {
            flex: 1; padding: 14px; background: transparent; border: 2px solid var(--blue-main);
            color: #90C0F0; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .tab.active {
            background: linear-gradient(135deg, #0055CC, #0099FF);
            color: white; box-shadow: 0 0 20px rgba(0,119,255,0.4); border-color: transparent;
        }
        
        input, textarea, select {
            width: 100%; padding: 14px; margin: 10px 0; border: 2px solid rgba(0,191,255,0.3);
            border-radius: 10px; background: rgba(0,20,50,0.4); color: white; font-size: 0.98rem;
        }
        input:focus, textarea:focus {outline: none; border-color: var(--blue-light); box-shadow: 0 0 15px rgba(0,191,255,0.3);}
        textarea {min-height: 100px; resize: vertical;}
        
        .file-upload {
            display: block; padding: 16px; background: rgba(0,119,255,0.1); border: 2px dashed var(--blue-light);
            border-radius: 12px; text-align: center; cursor: pointer; margin: 12px 0; transition: 0.3s;
        }
        .file-upload:hover {background: rgba(0,119,255,0.2); border-style: solid;}
        
        .act-btn {padding: 14px 28px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin: 6px; transition: 0.3s; font-size: 0.98rem;}
        .blue-btn {background: linear-gradient(135deg, #0066CC, #00BFFF); color: white;}
        .blue-btn:hover {box-shadow: 0 0 25px rgba(0,191,255,0.6); transform: scale(1.03);}
        .del-btn {background: linear-gradient(135deg, #CC2233, #EE4455); color: white;}
        .add-link-btn {padding: 10px 18px; background: #009944; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 8px 0;}
        
        .success {color: #00FF99; margin-top: 10px;}
        .error {color: #FF6677; margin-top: 10px;}
        .hidden {display: none !important;}
        
        .item-row {display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(255,255,255,0.05); border-radius: 10px; margin: 8px 0;}
        .link-row {display: flex; gap: 8px; align-items: center;}
        
        footer {text-align: center; margin-top: 60px; padding: 25px; color: #6699CC; font-size: 0.95rem; border-top: 1px solid rgba(0,191,255,0.15);}
    </style>
</head>
<body>
    <div class="container" id="main-page">
        <!-- کاور -->
        <div class="cover">
            <img id="cover-img" src="" alt="کاور" onerror="this.src='https://via.placeholder.com/900x220/001F3F/00BFFF?text=VORTEXPLAY'">
        </div>

        <header>
            <div class="logo-wrap">
                <img id="logo-img" src="" alt="لوگو" onerror="this.src='https://via.placeholder.com/125/0077FF/FFFFFF?text=VP'">
            </div>
            <h1 id="site-title">VORTEXPLAY</h1>
            <p class="desc" id="site-desc">پایگاه آبی بازی‌ها و سرگرمی</p>
        </header>

        <hr class="divider">

        <!-- دسته‌بندی‌ها -->
        <div class="cats" id="cats-bar"></div>

        <!-- لیست محتوا -->
        <div id="content-list"></div>

        <div class="admin-link">
            <button class="admin-btn" onclick="openAdmin()">🔐 پنل مدیریت</button>
        </div>

        <footer>
            <p>💙 VORTEXPLAY | تم آبی نئونی 🔥</p>
        </footer>
    </div>

    <!-- صفحه مدیریت -->
    <div class="container hidden" id="admin-page">
        <a href="javascript:closeAdmin()" class="back">← بازگشت به سایت</a>

        <!-- ورود -->
        <div id="login-box" class="panel">
            <h2>🔐 ورود به پنل</h2>
            <input type="password" id="pass-input" placeholder="رمز ۳۲ رقمی">
            <button class="act-btn blue-btn" onclick="checkPass()">ورود ✅</button>
            <p id="login-msg" class="error"></p>
        </div>

        <!-- پنل اصلی -->
        <div id="admin-panel" class="panel hidden">
            <h2>💙 کنترل کامل سایت</h2>
            <hr style="border:none; border-top:1px solid rgba(0,191,255,0.2); margin:20px 0;">

            <!-- دو تب -->
            <div class="panel-tabs">
                <button class="tab active" onclick="switchTab('design')">🎨 ظاهر و پس‌زمینه</button>
                <button class="tab" onclick="switchTab('content')">📦 محتوا و لینک‌ها</button>
            </div>

            <!-- === تب اول: ظاهر === -->
            <div id="tab-design">
                <h3>🎨 پس‌زمینه</h3>
                <label>انتخاب رنگ پس‌زمینه:</label>
                <input type="color" id="bg-color" value="#001F3F">
                <button class="act-btn blue-btn" onclick="applyBgColor()">اعمال رنگ</button>
                
                <label class="file-upload">
                    📷 یا انتخاب عکس پس‌زمینه از گالری
                    <input type="file" id="bg-image-file" accept="image/*" style="display:none" onchange="previewBgImage(event)">
                </label>
                <p id="bg-image-status" class="success"></p>
                <button class="act-btn del-btn" onclick="removeBgImage()">حذف عکس پس‌زمینه</button>

                <hr style="border:none; border-top:1px solid rgba(0,191,255,0.2); margin:25px 0;">

                <h3>🖼️ لوگو و کاور</h3>
                <label class="file-upload">
                    📷 انتخاب لوگو
                    <input type="file" id="logo-file" accept="image/*" style="display:none" onchange="previewLogo(event)">
                </label>
                <p id="logo-status" class="success"></p>

                <label class="file-upload">
                    🖼️ انتخاب کاور بالای صفحه
                    <input type="file" id="cover-file" accept="image/*" style="display:none" onchange="previewCover(event)">
                </label>
                <p id="cover-status" class="success"></p>

                <input type="text" id="edit-title" placeholder="نام سایت">
                <input type="text" id="edit-desc" placeholder="توضیح سایت">

                <button class="act-btn blue-btn" onclick="saveDesign()">✅ ذخیره همه تغییرات</button>
                <p id="design-msg" class="success"></p>
            </div>

            <!-- === تب دوم: محتوا === -->
            <div id="tab-content" class="hidden">
                <!-- دسته‌بندی‌ها -->
                <h3>📂 دسته‌بندی‌ها</h3>
                <input type="text" id="new-cat" placeholder="نام دسته‌بندی جدید">
                <button class="act-btn blue-btn" onclick="addCategory()">➕ ساخت دسته‌بندی</button>
                <div id="cat-list" style="margin-top:15px;"></div>

                <hr style="border:none; border-top:1px solid rgba(0,191,255,0.2); margin:25px 0;">

                <!-- محتوای جدید با لینک‌های نامحدود -->
                <h3>➕ انتشار محتوای جدید</h3>
                <select id="content-category"></select>
                <input type="text" id="content-title" placeholder="عنوان">
                <textarea id="content-desc" placeholder="توضیحات"></textarea>
                
                <label class="file-upload">
                    📷 عکس کاور محتوا
                    <input type="file" id="content-image" accept="image/*" style="display:none" onchange="previewContentImage(event)">
                </label>
                <p id="content-img-status" class="success"></p>

                <!-- لینک‌های دانلود نامحدود -->
                <h4 style="margin:15px 0 5px;">🔗 لینک‌های دانلود (نامحدود)</h4>
                <div id="links-container">
                    <div class="link-row">
                        <input type="text" class="link-name" placeholder="نام لینک" style="flex:1; margin:0;">
                        <input type="url" class="link-url" placeholder="لینک" style="flex:2; margin:0;">
                        <button class="act-btn del-btn" style="padding:10px 12px; margin:0;" onclick="this.parentElement.remove()">×</button>
                    </div>
                </div>
                <button class="add-link-btn" onclick="addNewLinkRow()">➕ افزودن لینک جدید</button>

                <button class="act-btn blue-btn" onclick="publishContent()">✅ انتشار محتوا</button>
                <p id="publish-msg" class="success"></p>
            </div>
        </div>
    </div>

    <script>
        // === تنظیمات ===
        let PASSWORD = "VORTEX9X7K2P4R8M3N5L6J1H9G8F7D6S5A4D3B";
        let activeTab = 'design';
        let bgImageData = null, logoData = null, coverData = null, contentImageData = null;
        let activeFilter = 'همه';

        // === بارگذاری همه داده‌ها ===
        function loadAll() {
            if(localStorage.getItem('admin_pass')) PASSWORD = localStorage.getItem('admin_pass');

            // پس‌زمینه
            const savedBgImg = localStorage.getItem('bg_image');
            const savedBgColor = localStorage.getItem('bg_color');
            if(savedBgImg) {
                document.body.style.backgroundImage = `url(${savedBgImg})`;
                document.body.style.backgroundBlendMode = 'overlay';
            }
            if(savedBgColor) {
                document.body.style.background = savedBgColor;
                document.getElementById('bg-color').value = savedBgColor;
            }

            // لوگو، کاور، عنوان
            const savedLogo = localStorage.getItem('logo');
            const savedCover = localStorage.getItem('cover');
            const savedTitle = localStorage.getItem('site_title') || 'VORTEXPLAY';
            const savedDesc = localStorage.getItem('site_desc') || 'پایگاه آبی بازی‌ها و سرگرمی';
            
            if(savedLogo) document.getElementById('logo-img').src = savedLogo;
            if(savedCover) document.getElementById('cover-img').src = savedCover;
            document.getElementById('site-title').textContent = savedTitle;
            document.getElementById('site-desc').textContent = savedDesc;
            document.getElementById('edit-title').value = savedTitle;
            document.getElementById('edit-desc').value = savedDesc;

            renderCategories();
            renderContent();
        }

        // === جابجایی تب‌ها ===
        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab').forEach((b, i) => b.classList.toggle('active', 
                (tab === 'design' && i === 0) || (tab === 'content' && i === 1)));
            document.getElementById('tab-design').classList.toggle('hidden', tab !== 'design');
            document.getElementById('tab-content').classList.toggle('hidden', tab !== 'content');
            if(tab === 'content') renderCatsInPanel();
        }

        // === پس‌زمینه ===
        function applyBgColor() {
            const color = document.getElementById('bg-color').value;
            document.body.style.background = color;
            document.body.style.backgroundImage = '';
            localStorage.setItem('bg_color', color);
            localStorage.removeItem('bg_image');
            bgImageData = null;
            alert('✅ رنگ پس‌زمینه تغییر کرد!');
        }
        function previewBgImage(e) {
            const r = new FileReader();
            r.onload = ev => {
                bgImageData = ev.target.result;
                document.getElementById('bg-image-status').textContent = '✅ عکس آماده ذخیره';
            };
            r.readAsDataURL(e.target.files[0]);
        }
        function removeBgImage() {
            localStorage.removeItem('bg_image');
            document.body.style.backgroundImage = '';
            bgImageData = null;
            alert('✅ عکس پس‌زمینه حذف شد!');
        }

        // === لوگو و کاور ===
        function previewLogo(e) {
            const r = new FileReader();
            r.onload = ev => { logoData = ev.target.result; document.getElementById('logo-status').textContent = '✅ لوگو آماده'; };
            r.readAsDataURL(e.target.files[0]);
        }
        function previewCover(e) {
            const r = new FileReader();
            r.onload = ev => { coverData = ev.target.result; document.getElementById('cover-status').textContent = '✅ کاور آماده'; };
            r.readAsDataURL(e.target.files[0]);
        }
        function saveDesign() {
            const t = document.getElementById('edit-title').value.trim();
            const d = document.getElementById('edit-desc').value.trim();
            
            if(bgImageData) {
                localStorage.setItem('bg_image', bgImageData);
                document.body.style.backgroundImage = `url(${bgImageData})`;
                localStorage.removeItem('bg_color');
                bgImageData = null;
            }
            if(logoData) { localStorage.setItem('logo', logoData); document.getElementById('logo-img').src = logoData; logoData = null; }
            if(coverData) { localStorage.setItem('cover', coverData); document.getElementById('cover-img').src = coverData; coverData = null; }
            if(t) { localStorage.setItem('site_title', t); document.getElementById('site-title').textContent = t; }
            if(d) { localStorage.setItem('site_desc', d); document.getElementById('site-desc').textContent = d; }
            
            document.getElementById('design-msg').textContent = '✅ همه تغییرات ذخیره شد!';
            setTimeout(() => document.getElementById('design-msg').textContent = '', 3000);
        }

        // === دسته‌بندی‌ها ===
        function getCats() { return JSON.parse(localStorage.getItem('categories') || '["همه"]'); }
        function saveCats(arr) { localStorage.setItem('categories', JSON.stringify(arr)); }
        function renderCategories() {
            const arr = getCats();
            const w = document.getElementById('cats-bar'); w.innerHTML = '';
            arr.forEach(c => {
                const s = document.createElement('span');
                s.className = 'cat' + (c === activeFilter ? ' active' : '');
                s.textContent = c;
                s.onclick = () => { activeFilter = c; renderCategories(); renderContent(); };
                w.appendChild(s);
            });
        }
        function renderCatsInPanel() {
            const arr = getCats();
            const list = document.getElementById('cat-list');
            const sel = document.getElementById('content-category');
            list.innerHTML = ''; sel.innerHTML = '';
            arr.filter(c => c !== 'همه').forEach(c => {
                const d = document.createElement('div');
                d.className = 'item-row';
                d.innerHTML = `<span>${c}</span><button class="act-btn del-btn" style="padding:6px 12px; font-size:0.85rem;" onclick="delCat('${c}')">حذف</button>`;
                list.appendChild(d);
                const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o);
            });
        }
        function addCategory() {
            const n = document.getElementById('new-cat').value.trim();
            if(!n) return alert('⚠️ نام بنویس!');
            const arr = getCats();
            if(arr.includes(n)) return alert('قبلاً هست!');
            arr.push(n); saveCats(arr);
            document.getElementById('new-cat').value = '';
            renderCategories(); renderCatsInPanel();
            alert('✅ دسته‌بندی ساخته شد!');
        }
        function delCat(name) {
            if(!confirm(`حذف "${name}"؟`)) return;
            let arr = getCats().filter(c => c !== name); saveCats(arr);
            renderCategories(); renderCatsInPanel();
        }

        // === لینک‌های نامحدود ===
        function addNewLinkRow() {
            const container = document.getElementById('links-container');
            const row = document.createElement('div');
            row.className = 'link-row';
            row.style.display = 'flex'; row.style.gap = '8px'; row.style.alignItems = 'center';
            row.innerHTML = `
                <input type="text" class="link-name" placeholder="نام لینک" style="flex:1; margin:0;">
                <input type="url" class="link-url" placeholder="لینک" style="flex:2; margin:0;">
                <button class="act-btn del-btn" style="padding:10px 12px; margin:0;" onclick="this.parentElement.remove()">×</button>
            `;
            container.appendChild(row);
        }

        // === محتوا ===
        function getContents() { return JSON.parse(localStorage.getItem('contents') || '[]'); }
        function saveContents(arr) { localStorage.setItem('contents', JSON.stringify(arr)); }
        function previewContentImage(e) {
            const r = new FileReader();
            r.onload = ev => { contentImageData = ev.target.result; document.getElementById('content-img-status').textContent = '✅ عکس انتخاب شد'; };
            r.readAsDataURL(e.target.files[0]);
        }
        function renderContent() {
            let arr = getContents();
            if(activeFilter !== 'همه') arr = arr.filter(x => x.category === activeFilter);
            const w = document.getElementById('content-list'); w.innerHTML = '';
            if(!arr.length) {
                w.innerHTML = '<p style="text-align:center; color:#6699CC; padding:40px;">هنوز محتوایی منتشر نشده</p>';
                return;
            }
            arr.forEach(x => {
                const d = document.createElement('div');
                d.className = 'card';
                let linksHtml = '';
                if(x.links && x.links.length > 0) {
                    x.links.forEach(link => {
                        linksHtml += `<a href="${link.url}" target="_blank" class="download-link">${link.name || 'دانلود'} 📥</a>`;
                    });
                }
                d.innerHTML = `
                    ${x.image ? `<img src="${x.image}" class="card-img" alt="">` : ''}
                    <h3>${x.title}</h3>
                    <p>${x.desc}</p>
                    <div style="margin-top:10px;">${linksHtml}</div>
                `;
                w.appendChild(d);
            });
        }
        function publishContent() {
            const cat = document.getElementById('content-category').value;
            const title = document.getElementById('content-title').value.trim();
            const desc = document.getElementById('content-desc').value.trim();
            
            // جمع‌آوری لینک‌ها
            const linkRows = document.querySelectorAll('#links-container .link-row');
            const links = [];
            linkRows.forEach(row => {
                const name = row.querySelector('.link-name').value.trim() || 'دانلود';
                const url = row.querySelector('.link-url').value.trim();
                if(url) links.push({name, url});
            });

            if(!cat || !title || links.length === 0) {
                return alert('⚠️ دسته‌بندی، عنوان و حداقل یک لینک را پر کن!');
            }

            const arr = getContents();
            arr.unshift({
                category: cat,
                title: title,
                desc: desc,
                links: links,
                image: contentImageData
            });
            saveContents(arr);

            // پاک کردن فرم
            document.getElementById('content-title').value = '';
            document.getElementById('content-desc').value = '';
            document.getElementById('links-container').innerHTML = `
                <div class="link-row">
                    <input type="text" class="link-name" placeholder="نام لینک" style="flex:1; margin:0;">
                    <input type="url" class="link-url" placeholder="لینک" style="flex:2; margin:0;">
                    <button class="act-btn del-btn" style="padding:10px 12px; margin:0;" onclick="this.parentElement.remove()">×</button>
                </div>
            `;
            contentImageData = null;
            document.getElementById('content-img-status').textContent = '';

            renderContent();
            document.getElementById('publish-msg').textContent = '✅ محتوا منتشر شد!';
            setTimeout(() => document.getElementById('publish-msg').textContent = '', 3000);
        }

        // === ورود و خروج ===
        function openAdmin() {
            document.getElementById('main-page').classList.add('hidden');
            document.getElementById('admin-page').classList.remove('hidden');
            document.getElementById('admin-panel').classList.add('hidden');
        }
        function closeAdmin() {
            document.getElementById('admin-page').classList.add('hidden');
            document.getElementById('main-page').classList.remove('hidden');
            document.getElementById('pass-input').value = '';
        }
        function checkPass() {
            const inp = document.getElementById('pass-input').value.trim();
            if(inp === PASSWORD) {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                switchTab('design');
            } else {
                document.getElementById('login-msg').textContent = '❌ رمز اشتباه!';
            }
        }

        // === شروع ===
        loadAll();
    </script>
</body>
</html>
