<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VORTEXPLAY — مرکز بازی و فایل</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚡%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ================= VORTEXPLAY CORE ================= */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07070f; --card:rgba(255,255,255,.045); --stroke:rgba(255,255,255,.1);
  --a1:#8b5cf6; --a2:#22d3ee; --txt:#f1f1fa; --muted:#8e8ea8; --danger:#ef4444;
}
body{
  min-height:100vh;background:var(--bg);color:var(--txt);
  font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;overflow-x:hidden;
}
/* ---- پس‌زمینه ---- */
#bg-layer{position:fixed;inset:0;z-index:-3;background-size:cover;background-position:center;display:none}
#vortex{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
#vortex::before,#vortex::after{content:'';position:absolute;width:65vmax;height:65vmax;border-radius:50%;filter:blur(80px);opacity:.33}
#vortex::before{background:radial-gradient(circle,#7c3aed 0%,transparent 62%);top:-22vmax;right:-18vmax;animation:f1 16s ease-in-out infinite}
#vortex::after{background:radial-gradient(circle,#0ea5e9 0%,transparent 62%);bottom:-22vmax;left:-18vmax;animation:f2 20s ease-in-out infinite}
@keyframes f1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-7vmax,5vmax) scale(1.18)}}
@keyframes f2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,-5vmax) scale(1.12)}}

/* ---- هدر ---- */
header{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;
  padding:14px 20px;background:rgba(10,10,20,.55);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--stroke);
}
.logo-box{display:flex;align-items:center;gap:10px}
.logo-box img{height:44px;max-width:170px;object-fit:contain;border-radius:8px}
.brand{font-size:1.45rem;font-weight:900;letter-spacing:1px;
  background:linear-gradient(90deg,var(--a1),var(--a2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand .zap{color:var(--a2);-webkit-text-fill-color:var(--a2)}

main{max-width:920px;margin:0 auto;padding:26px 18px 90px}

/* ---- صفحه اصلی ---- */
.hero{text-align:center;padding:30px 10px 34px}
.hero h1{font-size:1.9rem;font-weight:900}
.hero h1 span{background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin-top:10px;font-size:.95rem}
.stats{display:flex;justify-content:center;gap:14px;margin-top:22px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--stroke);border-radius:14px;padding:10px 22px;text-align:center;min-width:105px}
.stat b{font-size:1.35rem;display:block;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat small{color:var(--muted);font-size:.75rem}
.section-title{display:flex;align-items:center;gap:10px;margin:30px 0 16px;font-size:1.1rem;font-weight:700}
.section-title::after{content:'';flex:1;height:1px;background:var(--stroke)}

.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.cat-card{
  background:var(--card);border:1px solid var(--stroke);border-radius:18px;
  padding:20px 14px;text-align:center;cursor:pointer;
  transition:transform .25s,border-color .25s,box-shadow .25s;
}
.cat-card:hover{transform:translateY(-6px);border-color:rgba(139,92,246,.6);box-shadow:0 12px 32px rgba(139,92,246,.25)}
.cat-icon{font-size:2.3rem}
.cat-name{font-weight:700;margin-top:10px}
.cat-desc{color:var(--muted);font-size:.78rem;margin-top:6px;line-height:1.7}
.cat-count{display:inline-block;margin-top:12px;font-size:.72rem;padding:4px 12px;border-radius:999px;background:rgba(139,92,246,.15);color:#c4b5fd}

.empty{text-align:center;color:var(--muted);padding:50px 15px;border:1px dashed var(--stroke);border-radius:18px;line-height:2}
.empty .big{font-size:2.5rem}

/* ---- صفحه دسته ---- */
.back-btn{
  display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--stroke);
  color:var(--txt);padding:9px 18px;border-radius:12px;cursor:pointer;font-family:inherit;
  font-size:.88rem;margin-bottom:20px;transition:border-color .2s;
}
.back-btn:hover{border-color:var(--a1)}
.cat-head{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.cat-head .cat-icon{font-size:2.6rem}
.cat-head h2{font-size:1.5rem}
.cat-head p{color:var(--muted);font-size:.85rem;margin-top:4px}

.post{background:var(--card);border:1px solid var(--stroke);border-radius:16px;padding:18px;margin-bottom:14px;animation:up .35s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.post-date{color:var(--muted);font-size:.72rem;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.post-text{white-space:pre-wrap;word-break:break-word;line-height:2}
.post-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.dl-btn{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  background:linear-gradient(90deg,var(--a1),var(--a2));color:#fff;border:none;
  padding:10px 24px;border-radius:12px;font-weight:700;cursor:pointer;font-family:inherit;
  font-size:.9rem;transition:transform .2s,opacity .2s;
}
.dl-btn:hover{transform:translateY(-2px);opacity:.92}
.copy-btn{background:var(--card);border:1px solid var(--stroke);color:var(--muted);padding:10px 16px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:.85rem;transition:.2s}
.copy-btn:hover{color:var(--txt);border-color:var(--a1)}

/* ---- فوتر ---- */
footer{
  position:fixed;bottom:0;left:0;right:0;z-index:40;text-align:center;padding:12px;
  background:linear-gradient(to top,rgba(7,7,15,.95),transparent);
}
#admin-btn{
  background:var(--card);border:1px solid var(--stroke);color:var(--muted);
  padding:9px 22px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:.82rem;
  transition:.25s;
}
#admin-btn:hover{color:var(--txt);border-color:var(--a1);box-shadow:0 0 20px rgba(139,92,246,.3)}

/* ---- مودال مدیریت ---- */
#admin-modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);
  display:none;align-items:flex-start;justify-content:center;padding:18px;overflow-y:auto}
#admin-modal.open{display:flex}
.modal{
  background:#12121e;border:1px solid var(--stroke);border-radius:20px;width:100%;
  max-width:560px;margin:auto;max-height:92vh;overflow-y:auto;animation:pop .3s;
}
@keyframes pop{from{transform:scale(.93);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--stroke)}
.modal-head h3{font-size:1.05rem}
.x-btn{background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer}
.x-btn:hover{color:var(--danger)}
.modal-body{padding:22px}

.inp{
  width:100%;background:rgba(255,255,255,.05);border:1px solid var(--stroke);border-radius:12px;
  padding:12px 14px;color:var(--txt);font-family:inherit;font-size:.95rem;outline:none;transition:border .2s;
}
.inp:focus{border-color:var(--a1)}
textarea.inp{resize:vertical;min-height:100px;line-height:1.9}
select.inp{cursor:pointer}
select.inp option{background:#12121e}
label.lbl{display:block;color:var(--muted);font-size:.8rem;margin:14px 0 7px}

.btn{
  width:100%;margin-top:18px;padding:13px;border:none;border-radius:12px;cursor:pointer;
  font-family:inherit;font-weight:700;font-size:.95rem;color:#fff;
  background:linear-gradient(90deg,var(--a1),var(--a2));transition:transform .2s,opacity .2s;
}
.btn:hover{transform:translateY(-2px);opacity:.93}
.btn-danger{background:linear-gradient(90deg,#ef4444,#f97316)}
.btn-ghost{background:var(--card);border:1px solid var(--stroke);color:var(--muted)}
.btn-ghost:hover{color:var(--txt)}

.err{color:var(--danger);font-size:.82rem;text-align:center;margin-top:12px;min-height:1.2em}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(7px)}75%{transform:translateX(-7px)}}

.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tab{flex:1;min-width:95px;padding:10px 6px;border-radius:12px;background:rgba(255,255,255,.05);
  border:1px solid var(--stroke);cursor:pointer;color:var(--muted);font-family:inherit;font-size:.82rem;
  text-align:center;transition:.2s}
.tab.active{background:linear-gradient(90deg,rgba(139,92,246,.25),rgba(34,211,238,.25));color:var(--txt);border-color:rgba(139,92,246,.55)}
.panel{display:none}.panel.active{display:block}

.admin-item{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--card);border:1px solid var(--stroke);border-radius:12px;
  padding:12px 14px;margin-bottom:9px;font-size:.88rem}
.admin-item .del{background:none;border:1px solid rgba(239,68,68,.35);color:var(--danger);
  padding:5px 13px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:.78rem;transition:.2s;white-space:nowrap}
.admin-item .del:hover{background:rgba(239,68,68,.15)}
.admin-item small{display:block;color:var(--muted);font-size:.72rem;margin-top:3px}

.preview-box{margin-top:12px;border:1px dashed var(--stroke);border-radius:14px;padding:14px;text-align:center;display:none}
.preview-box img{max-width:100%;max-height:130px;border-radius:8px}
.mini-row{display:flex;gap:9px;margin-top:12px}
.mini-row .btn{margin-top:0;padding:9px;font-size:.85rem}

hr.sep{border:none;border-top:1px solid var(--stroke);margin:26px 0}

/* ---- توست ---- */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(90px);
  background:#1c1c2c;border:1px solid var(--stroke);padding:12px 26px;border-radius:12px;z-index:200;
  opacity:0;transition:.35s;pointer-events:none;font-size:.9rem;box-shadow:0 12px 34px rgba(0,0,0,.55);max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:520px){
  .hero h1{font-size:1.5rem}
  .brand{font-size:1.2rem}
  .logo-box img{height:36px}
  .cat-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  main{padding:20px 13px 100px}
}
</style>
</head>
<body>

<div id="bg-layer"></div>
<div id="vortex"></div>

<header>
  <div class="logo-box" id="logo-box"></div>
</header>

<main id="main-view"></main>

<footer>
  <button id="admin-btn">⚙️ پنل مدیریت</button>
</footer>

<!-- ================= مودال مدیریت ================= -->
<div id="admin-modal">
  <div class="modal">

    <!-- ورود -->
    <div id="login-view">
      <div class="modal-head"><h3>🔐 ورود به مدیریت</h3><button class="x-btn" onclick="closeAdmin()">✕</button></div>
      <div class="modal-body">
        <label class="lbl">رمز عبور مدیریت</label>
        <input type="password" class="inp" id="login-pass" placeholder="رمز را وارد کنید..." autocomplete="off">
        <button class="btn" onclick="doLogin()">🔓 ورود</button>
        <div class="err" id="login-err"></div>
      </div>
    </div>

    <!-- داشبورد -->
    <div id="dash-view" style="display:none">
      <div class="modal-head"><h3>🎛️ پنل مدیریت VORTEXPLAY</h3><button class="x-btn" onclick="closeAdmin()">✕</button></div>
      <div class="modal-body">

        <div class="tabs">
          <div class="tab active" data-tab="cats" onclick="switchTab('cats')">🗂 دسته‌بندی</div>
          <div class="tab" data-tab="msgs" onclick="switchTab('msgs')">✉️ پیام‌ها</div>
          <div class="tab" data-tab="look" onclick="switchTab('look')">🎨 ظاهر</div>
        </div>

        <!-- تب دسته‌بندی -->
        <div class="panel active" id="panel-cats">
          <label class="lbl">ایموجی / آیکون (مثال: 🎮)</label>
          <input class="inp" id="cat-icon" value="🎮" maxlength="4">
          <label class="lbl">نام دسته‌بندی *</label>
          <input class="inp" id="cat-name" placeholder="مثال: بازی‌های اکشن">
          <label class="lbl">توضیح کوتاه</label>
          <input class="inp" id="cat-desc" placeholder="مثال: جدیدترین بازی‌های اکشن اندروید">
          <button class="btn" onclick="addCategory()">➕ ساخت دسته‌بندی</button>
          <hr class="sep">
          <label class="lbl">دسته‌بندی‌های موجود (برای حذف بزن)</label>
          <div id="admin-cat-list"></div>
        </div>

        <!-- تب پیام‌ها -->
        <div class="panel" id="panel-msgs">
          <label class="lbl">انتخاب دسته‌بندی</label>
          <select class="inp" id="msg-cat"></select>
          <label class="lbl">متن پیام *</label>
          <textarea class="inp" id="msg-text" placeholder="توضیحات، مشخصات، راهنما و..."></textarea>
          <label class="lbl">لینک دانلود (اختیاری)</label>
          <input class="inp" id="msg-link" placeholder="https://example.com/file.zip" dir="ltr">
          <button class="btn" onclick="addPost()">🚀 ارسال پیام</button>
          <hr class="sep">
          <label class="lbl">پیام‌های ارسال‌شده (برای حذف بزن)</label>
          <div id="admin-msg-list"></div>
        </div>

        <!-- تب ظاهر -->
        <div class="panel" id="panel-look">
          <label class="lbl">🖼 لوگوی سایت</label>
          <input type="file" id="logo-input" accept="image/*" hidden>
          <button class="btn btn-ghost" onclick="logoInput.click()">📤 انتخاب عکس لوگو</button>
          <div class="preview-box" id="logo-preview-box">
            <img id="logo-preview" alt="پیش‌نمایش لوگو">
            <div class="mini-row">
              <button class="btn" onclick="saveLogo()">✅ تایید و ذخیره</button>
              <button class="btn btn-ghost" onclick="cancelLogo()">✖ لغو</button>
            </div>
          </div>
          <button class="btn btn-danger" style="margin-top:10px" onclick="deleteLogo()">🗑 حذف لوگو فعلی</button>

          <hr class="sep">

          <label class="lbl">🌌 پس‌زمینه سایت</label>
          <input type="file" id="bg-input" accept="image/*" hidden>
          <button class="btn btn-ghost" onclick="bgInput.click()">📤 انتخاب عکس پس‌زمینه</button>
          <div class="preview-box" id="bg-preview-box">
            <img id="bg-preview" alt="پیش‌نمایش پس‌زمینه">
            <div class="mini-row">
              <button class="btn" onclick="saveBg()">✅ تایید و ذخیره</button>
              <button class="btn btn-ghost" onclick="cancelBg()">✖ لغو</button>
            </div>
          </div>
          <button class="btn btn-danger" style="margin-top:10px" onclick="deleteBg()">🗑 حذف پس‌زمینه فعلی</button>

          <hr class="sep">
          <button class="btn btn-danger" onclick="resetAll()">⚠️ پاک کردن کل داده‌ها</button>
          <button class="btn btn-ghost" style="margin-top:10px" onclick="logout()">🚪 خروج از مدیریت</button>
        </div>

      </div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script>
/* ================== VORTEXPLAY ENGINE ================== */
const ADMIN_PASS = 'CECGAA0MMLOGOBYEIZXQUXKCFOJOKYFRTUJDXHRHDAOFCUXMUGXMMLGZBPSWWZGR';
const K = { cat:'vp_categories', post:'vp_posts', logo:'vp_logo', bg:'vp_bg' };

const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => { u=(u||'').trim(); return /^(https?:|magnet:)/i.test(u) ? u : 'https://'+u.replace(/^\/+/,''); };

function load(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ toast('⚠️ حافظه مرورگر پر شده!'); } }

/* ---------- state ---------- */
let categories = load(K.cat, null);
if(categories === null){
  categories = [
    {id:uid(), icon:'🎮', name:'بازی‌های اندروید', desc:'بهترین بازی‌ها با لینک مستقیم'},
    {id:uid(), icon:'💾', name:'نرم‌افزار و اپلیکیشن', desc:'اپلیکیشن‌های کاربردی و پرطرفدار'},
    {id:uid(), icon:'📦', name:'فایل‌های متفرقه', desc:'هر فایلی که لازم داشته باشی'},
  ];
  save(K.cat, categories);
}
let posts = load(K.post, []);
let currentView = 'home';
let isAdmin = false;

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ---------- look (logo & background) ---------- */
function applyLook(){
  const logo = load(K.logo, null), bg = load(K.bg, null);
  $('logo-box').innerHTML = logo
    ? `<img src="${logo}" alt="logo">`
    : `<span class="brand">VORTEX<span class="zap">PLAY</span> ⚡</span>`;
  if(bg){
    $('bg-layer').style.backgroundImage = `linear-gradient(rgba(7,7,15,.87),rgba(7,7,15,.93)), url("${bg}")`;
    $('bg-layer').style.display = 'block';
    $('vortex').style.display = 'none';
  } else {
    $('bg-layer').style.display = 'none';
    $('vortex').style.display = 'block';
  }
}

/* ---------- render: home ---------- */
function renderHome(){
  const total = posts.length;
  let html = `
  <section class="hero">
    <h1>به <span>VORTEXPLAY</span> خوش اومدی ⚡</h1>
    <p>مرکز دانلود بازی و فایل — همه‌چیز سریع، ساده و مستقیم</p>
    <div class="stats">
      <div class="stat"><b>${categories.length}</b><small>دسته‌بندی</small></div>
      <div class="stat"><b>${total}</b><small>پیام و فایل</small></div>
    </div>
  </section>
  <div class="section-title">🗂 دسته‌بندی‌ها</div>`;

  if(!categories.length){
    html += `<div class="empty"><div class="big">🕳️</div>هنوز دسته‌بندی‌ای ساخته نشده!<br>از پنل مدیریت یکی بساز.</div>`;
  } else {
    html += `<div class="cat-grid">` + categories.map(c=>{
      const n = posts.filter(p=>p.catId===c.id).length;
      return `<div class="cat-card" onclick="openCat('${c.id}')">
        <div class="cat-icon">${esc(c.icon||'🎮')}</div>
        <div class="cat-name">${esc(c.name)}</div>
        <div class="cat-desc">${esc(c.desc||'')}</div>
        <span class="cat-count">${n} آیتم</span>
      </div>`;
    }).join('') + `</div>`;
  }
  $('main-view').innerHTML = html;
}

/* ---------- render: category ---------- */
function openCat(id){ currentView = id; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function goHome(){ currentView = 'home'; render(); }

function renderCategory(id){
  const c = categories.find(x=>x.id===id);
  if(!c){ goHome(); return; }
  const list = posts.filter(p=>p.catId===id).slice().reverse();
  let html = `
  <button class="back-btn" onclick="goHome()">→ بازگشت</button>
  <div class="cat-head">
    <div class="cat-icon">${esc(c.icon||'🎮')}</div>
    <div><h2>${esc(c.name)}</h2><p>${esc(c.desc||'')}</p></div>
  </div>`;

  if(!list.length){
    html += `<div class="empty"><div class="big">📭</div>هنوز چیزی در این دسته ارسال نشده!</div>`;
  } else {
    html += list.map(p=>`
    <div class="post">
      <div class="post-date">🕐 ${esc(p.date)}</div>
      <div class="post-text">${esc(p.text)}</div>
      ${p.link ? `<div class="post-actions">
        <a class="dl-btn" href="${esc(safeUrl(p.link))}" target="_blank" rel="noopener">⬇️ دانلود / مشاهده</a>
        <button class="copy-btn" onclick="copyLink(this,'${esc(p.link)}')">📋 کپی لینک</button>
      </div>` : ''}
    </div>`).join('');
  }
  $('main-view').innerHTML = html;
}

function copyLink(btn, link){
  navigator.clipboard.writeText(safeUrl(link)).then(()=>{ toast('✅ لینک کپی شد!'); });
}

function render(){ currentView==='home' ? renderHome() : renderCategory(currentView); }

/* ---------- admin: open / login ---------- */
 $('admin-btn').onclick = openAdmin;
function openAdmin(){
  $('admin-modal').classList.add('open');
  isAdmin ? showDash() : showLogin();
}
function closeAdmin(){ $('admin-modal').classList.remove('open'); }
 $('admin-modal').addEventListener('click', e=>{ if(e.target.id==='admin-modal') closeAdmin(); });
 $('login-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

function showLogin(){ $('login-view').style.display='block'; $('dash-view').style.display='none'; $('login-err').textContent=''; $('login-pass').value=''; }
function showDash(){ $('login-view').style.display='none'; $('dash-view').style.display='block'; renderAdminLists(); }

function doLogin(){
  if($('login-pass').value === ADMIN_PASS){
    isAdmin = true; showDash(); toast('✅ خوش آمدی مدیر!');
  } else {
    $('login-err').textContent = '❌ رمز اشتباه است!';
    $('login-pass').classList.remove('shake'); void $('login-pass').offsetWidth;
    $('login-pass').classList.add('shake');
  }
}
function logout(){ isAdmin = false; closeAdmin(); toast('خروج انجام شد 👋'); }

/* ---------- admin: tabs ---------- */
function switchTab(t){
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active', el.dataset.tab===t));
  document.querySelectorAll('.panel').forEach(el=>el.classList.toggle('active', el.id==='panel-'+t));
}

/* ---------- admin: categories ---------- */
function addCategory(){
  const name = $('cat-name').value.trim();
  if(!name){ toast('⚠️ نام دسته‌بندی لازمه!'); return; }
  categories.push({ id:uid(), icon:$('cat-icon').value.trim()||'🎮', name, desc:$('cat-desc').value.trim() });
  save(K.cat, categories);
  $('cat-name').value=''; $('cat-desc').value='';
  renderAdminLists(); render(); toast('✅ دسته‌بندی ساخته شد!');
}
function deleteCategory(id){
  const c = categories.find(x=>x.id===id);
  if(!confirm(`دسته «${c?c.name:''}» و همه پیام‌هایش حذف شود؟`)) return;
  categories = categories.filter(x=>x.id!==id);
  posts = posts.filter(p=>p.catId!==id);
  save(K.cat, categories); save(K.post, posts);
  if(currentView===id) currentView='home';
  renderAdminLists(); render(); toast('🗑 دسته‌بندی حذف شد');
}

/* ---------- admin: posts ---------- */
function addPost(){
  const catId = $('msg-cat').value;
  const text  = $('msg-text').value.trim();
  const link  = $('msg-link').value.trim();
  if(!catId){ toast('⚠️ اول یک دسته‌بندی انتخاب کن!'); return; }
  if(!text && !link){ toast('⚠️ حداقل متن یا لینک را پر کن!'); return; }
  posts.push({
    id:uid(), catId, text:text||'—',
    link, date:new Date().toLocaleDateString('fa-IR',{year:'numeric',month:'long',day:'numeric'})
  });
  save(K.post, posts);
  $('msg-text').value=''; $('msg-link').value='';
  renderAdminLists(); render(); toast('🚀 پیام ارسال و ذخیره شد!');
}
function deletePost(id){
  posts = posts.filter(p=>p.id!==id);
  save(K.post, posts);
  renderAdminLists(); render(); toast('🗑 پیام حذف شد');
}

/* ---------- admin: lists ---------- */
function renderAdminLists(){
  $('msg-cat').innerHTML = categories.length
    ? categories.map(c=>`<option value="${c.id}">${esc(c.icon)} ${esc(c.name)}</option>`).join('')
    : `<option value="">— دسته‌ای موجود نیست —</option>`;

  $('admin-cat-list').innerHTML = categories.length
    ? categories.map(c=>`<div class="admin-item">
        <span>${esc(c.icon)} ${esc(c.name)} <small>${posts.filter(p=>p.catId===c.id).length} پیام</small></span>
        <button class="del" onclick="deleteCategory('${c.id}')">حذف</button>
      </div>`).join('')
    : `<div class="empty" style="padding:18px">دسته‌ای نیست</div>`;

  $('admin-msg-list').innerHTML = posts.length
    ? posts.slice().reverse().map(p=>{
        const c = categories.find(x=>x.id===p.catId);
        return `<div class="admin-item">
          <span>${esc((p.text||'').slice(0,42))}${(p.text||'').length>42?'...':''}
            <small>${esc(c?c.name:'—')} • ${esc(p.date)}</small></span>
          <button class="del" onclick="deletePost('${p.id}')">حذف</button>
        </div>`;
      }).join('')
    : `<div class="empty" style="padding:18px">پیامی نیست</div>`;
}

/* ---------- admin: image process (فشرده‌سازی خودکار) ---------- */
function processImage(file, maxSize, cb){
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      const s = Math.min(1, maxSize / Math.max(w,h));
      w = Math.round(w*s); h = Math.round(h*s);
      const cv = document.createElement('canvas');
      cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      let data = cv.toDataURL('image/webp', .9);
      if(!data.startsWith('data:image/webp')) data = cv.toDataURL('image/jpeg', .82);
      cb(data);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------- logo ---------- */
let pendingLogo = null;
 $('logo-input').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  processImage(f, 500, data=>{
    pendingLogo = data;
    $('logo-preview').src = data;
    $('logo-preview-box').style.display = 'block';
  });
  e.target.value='';
};
function saveLogo(){
  if(!pendingLogo) return;
  save(K.logo, pendingLogo); applyLook(); cancelLogo(); toast('✅ لوگو ذخیره شد!');
}
function cancelLogo(){ pendingLogo=null; $('logo-preview-box').style.display='none'; }
function deleteLogo(){
  localStorage.removeItem(K.logo); applyLook(); toast('🗑 لوگو حذف شد');
}

/* ---------- background ---------- */
let pendingBg = null;
 $('bg-input').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  processImage(f, 1600, data=>{
    pendingBg = data;
    $('bg-preview').src = data;
    $('bg-preview-box').style.display = 'block';
  });
  e.target.value='';
};
function saveBg(){
  if(!pendingBg) return;
  save(K.bg, pendingBg); applyLook(); cancelBg(); toast('✅ پس‌زمینه ذخیره شد!');
}
function cancelBg(){ pendingBg=null; $('bg-preview-box').style.display='none'; }
function deleteBg(){
  localStorage.removeItem(K.bg); applyLook(); toast('🗑 پس‌زمینه حذف شد');
}

/* ---------- reset ---------- */
function resetAll(){
  if(!confirm('⚠️ همه داده‌ها (دسته‌ها، پیام‌ها، لوگو، پس‌زمینه) پاک شود؟')) return;
  localStorage.clear();
  location.reload();
}

/* ---------- init ---------- */
applyLook();
render();
</script>
