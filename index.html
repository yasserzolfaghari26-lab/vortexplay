<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEXPLAY | CYBER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        :root {
            --cyber-pink: #FF2E97;
            --cyber-cyan: #00F0FF;
            --cyber-purple: #9D2EFF;
            --cyber-yellow: #FFE600;
            --bg-dark: #050508;
            --bg-card: #0F0F1A;
            --bg-glass: rgba(18, 18, 32, 0.7);
            --text-white: #FFFFFF;
            --text-dim: #8888AA;
            --border-glow: 1px solid rgba(0, 240, 255, 0.35);
        }

        body {
            background: radial-gradient(circle at top right, rgba(255, 46, 151, 0.12) 0%, transparent 45%),
                        radial-gradient(circle at bottom left, rgba(0, 240, 255, 0.12) 0%, transparent 45%),
                        linear-gradient(180deg, #050508 0%, #0F0F1A 50%, #050508 100%);
            color: var(--text-white);
            min-height: 100vh;
        }

        .container { max-width: 480px; margin: 0 auto; padding: 25px 20px 40px; }

        /* === خطوط پس‌زمینه سایبر === */
        .grid-bg {
            position: fixed; inset: 0;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none; z-index: 0;
        }

        /* === سرصفحه === */
        .header { text-align: center; margin-bottom: 30px; position: relative; z-index: 1; }
        
        .logo-ring {
            width: 130px; height: 130px; margin: 0 auto 15px; border-radius: 50%;
            background: conic-gradient(from 0deg, var(--cyber-pink), var(--cyber-cyan), var(--cyber-purple), var(--cyber-pink));
            padding: 3px;
            animation: spin 8s linear infinite;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4), 0 0 60px rgba(255, 46, 151, 0.25);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .logo-inner {
            width: 100%; height: 100%; border-radius: 50%;
            background: var(--bg-dark);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            animation: unspin 8s linear infinite;
        }
        @keyframes unspin { to { transform: rotate(-360deg); } }
        
        .logo-text {
            font-size: 32px; font-weight: 900;
            background: linear-gradient(135deg, var(--cyber-cyan), var(--cyber-pink));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .site-title {
            font-size: 28px; font-weight: 900; letter-spacing: 3px;
            color: var(--cyber-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.7), 0 0 20px rgba(0, 240, 255, 0.4);
            margin-bottom: 5px;
        }
        
        .site-desc {
            color: var(--cyber-pink); font-size: 14px; letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(255, 46, 151, 0.5);
        }

        .status-bar {
            background: var(--bg-glass); border: var(--border-glow);
            border-radius: 6px; padding: 12px 20px; margin-bottom: 25px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            backdrop-filter: blur(10px);
        }
        .status-dot {
            width: 12px; height: 12px; border-radius: 2px;
            background: var(--cyber-cyan);
            box-shadow: 0 0 10px var(--cyber-cyan), 0 0 20px var(--cyber-cyan);
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }

        /* === کارت دسته‌بندی === */
        .cat-card {
            background: var(--bg-glass); border: 1px solid rgba(157, 46, 255, 0.3);
            border-radius: 8px; padding: 20px; margin-bottom: 14px; cursor: pointer;
            transition: 0.3s ease;
            position: relative; overflow: hidden;
            backdrop-filter: blur(8px);
        }
        .cat-card::before {
            content: ''; position: absolute; top: 0; right: 0; width: 4px; height: 100%;
            background: linear-gradient(180deg, var(--cyber-pink), var(--cyber-purple));
        }
        .cat-card:hover {
            transform: translateX(-5px);
            border-color: var(--cyber-cyan);
            box-shadow: -8px 0 25px rgba(0, 240, 255, 0.2), inset 0 0 20px rgba(0, 240, 255, 0.05);
        }
        .cat-name {
            font-size: 18px; font-weight: 800; color: var(--cyber-cyan); margin-bottom: 6px;
            text-shadow: 0 0 6px rgba(0, 240, 255, 0.4);
        }
        .cat-desc { font-size: 13px; color: var(--text-dim); }

        .admin-btn {
            width: 100%; margin-top: 30px; padding: 15px;
            background: linear-gradient(90deg, var(--cyber-purple), var(--cyber-pink));
            border: none; border-radius: 6px; color: #fff;
            font-weight: 800; font-size: 15px; cursor: pointer; letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(157, 46, 255, 0.4);
            transition: 0.3s;
        }
        .admin-btn:hover { box-shadow: 0 0 25px rgba(255, 46, 151, 0.6); transform: scale(1.02); }

        /* === صفحه پیام‌ها === */
        .msg-page {
            position: fixed; inset: 0; background: var(--bg-dark); z-index: 100;
            display: none; flex-direction: column;
        }
        .msg-page.active { display: flex; }
        .page-head {
            background: var(--bg-card); padding: 15px 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(0, 240, 255, 0.25);
        }
        .back-btn {
            width: 38px; height: 38px; border-radius: 4px;
            background: rgba(0, 240, 255, 0.1); border: 1px solid rgba(0, 240, 255, 0.4);
            color: var(--cyber-cyan); font-size: 16px; cursor: pointer;
            transition: 0.3s;
        }
        .back-btn:hover { background: rgba(0, 240, 255, 0.2); box-shadow: 0 0 12px rgba(0, 240, 255, 0.5); }
        .page-name { font-size: 17px; font-weight: 800; color: var(--cyber-cyan); text-shadow: 0 0 6px rgba(0, 240, 255, 0.4); }
        .msgs-box { flex: 1; overflow-y: auto; padding: 20px; }
        .msg-bubble {
            background: rgba(157, 46, 255, 0.08);
            border: 1px solid rgba(255, 46, 151, 0.3);
            border-radius: 6px; padding: 16px; margin-bottom: 14px;
            line-height: 1.7; position: relative;
        }
        .msg-bubble::before {
            content: ''; position: absolute; top: 0; right: 15px; width: 30px; height: 2px;
            background: linear-gradient(90deg, var(--cyber-pink), transparent);
        }
        .empty { text-align: center; color: var(--text-dim); padding: 60px 20px; }

        /* === مودال ورود === */
        .modal {
            position: fixed; inset: 0; background: rgba(5, 5, 8, 0.95); z-index: 200;
            display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-box {
            width: 100%; max-width: 400px; background: var(--bg-card);
            border: 1px solid var(--cyber-purple); border-radius: 8px; padding: 25px;
            box-shadow: 0 0 30px rgba(157, 46, 255, 0.3);
        }
        .modal-title {
            font-size: 20px; font-weight: 900; color: var(--cyber-cyan);
            text-align: center; margin-bottom: 20px; text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
        }
        .input {
            width: 100%; padding: 14px 16px; margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 4px; color: #fff; font-size: 15px;
        }
        .input:focus { outline: none; border-color: var(--cyber-cyan); box-shadow: 0 0 12px rgba(0, 240, 255, 0.4); }
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 4px;
            font-weight: 800; font-size: 15px; cursor: pointer; margin-top: 5px;
            transition: 0.3s;
        }
        .btn-cyber {
            background: linear-gradient(90deg, var(--cyber-cyan), var(--cyber-purple));
            color: #000; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }
        .btn-cyber:hover { box-shadow: 0 0 25px rgba(0, 240, 255, 0.7); }
        .btn-pink {
            background: linear-gradient(90deg, var(--cyber-pink), var(--cyber-purple));
            color: #fff; box-shadow: 0 0 15px rgba(255, 46, 151, 0.4);
        }
        .btn-pink:hover { box-shadow: 0 0 25px rgba(255, 46, 151, 0.7); }
        .btn-green {
            background: linear-gradient(90deg, #00C853, #00E676);
            color: #000; box-shadow: 0 0 15px rgba(0, 200, 83, 0.4);
        }
        .err { color: var(--cyber-pink); text-align: center; margin-top: 10px; display: none; }

        /* === پنل مدیریت === */
        .panel {
            position: fixed; inset: 0; background: var(--bg-dark); z-index: 300;
            display: none; overflow-y: auto;
        }
        .panel.active { display: block; }
        .panel-wrap { max-width: 480px; margin: 0 auto; padding: 25px 20px 50px; }
        .panel-head {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.25);
        }
        .panel-title {
            font-size: 22px; font-weight: 900;
            background: linear-gradient(90deg, var(--cyber-cyan), var(--cyber-pink));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .close-panel {
            width: 38px; height: 38px; border-radius: 4px;
            background: rgba(255, 46, 151, 0.1); border: 1px solid rgba(255, 46, 151, 0.4);
            color: var(--cyber-pink); font-size: 18px; cursor: pointer;
        }
        .section { margin-bottom: 30px; }
        .sec-title {
            font-size: 16px; font-weight: 800; color: var(--cyber-cyan); margin-bottom: 12px;
            text-shadow: 0 0 6px rgba(0, 240, 255, 0.3);
        }
        .item {
            background: var(--bg-card); border: 1px solid rgba(157, 46, 255, 0.25);
            border-radius: 6px; padding: 16px; margin-bottom: 10px;
        }
        .note {
            margin-top: 12px; padding: 12px; background: rgba(0, 240, 110, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.4); border-radius: 4px;
            color: #00FF88; text-align: center; display: none;
        }
        label { font-size: 14px; color: var(--text-dim); margin-bottom: 6px; display: block; }
        textarea { resize: vertical; min-height: 100px; }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    
    <!-- صفحه اصلی -->
    <div class="container" id="mainPage">
        <div class="header">
            <div class="logo-ring">
                <div class="logo-inner">
                    <span class="logo-text">VP</span>
                </div>
            </div>
            <h1 class="site-title">VORTEXPLAY</h1>
            <p class="site-desc">CYBER GAMING STATION</p>
        </div>

        <div class="status-bar">
            <span class="status-dot"></span>
            <span>سیستم آنلاین و فعال</span>
        </div>

        <div id="catsList"></div>

        <button class="admin-btn" id="openPanelBtn">
            <i class="fas fa-terminal"></i> پنل مدیریت
        </button>
    </div>

    <!-- صفحه پیام‌ها -->
    <div class="msg-page" id="msgPage">
        <div class="page-head">
            <button class="back-btn" id="backBtn"><i class="fas fa-chevron-right"></i></button>
            <h2 class="page-name" id="pageTitle"></h2>
            <div></div>
        </div>
        <div class="msgs-box" id="msgsBox"></div>
    </div>

    <!-- مودال ورود -->
    <div class="modal" id="loginModal">
        <div class="modal-box">
            <h2 class="modal-title">ورود به سیستم مدیریت</h2>
            <input type="password" class="input" id="passInput" placeholder="رمز ۳۲ رقمی" maxlength="64">
            <p class="err" id="passErr">⚠️ رمز نامعتبر است!</p>
            <button class="btn btn-cyber" id="loginBtn">ورود به سیستم</button>
        </div>
    </div>

    <!-- پنل مدیریت -->
    <div class="panel" id="adminPanel">
        <div class="panel-wrap">
            <div class="panel-head">
                <h2 class="panel-title">کنسول مدیریت</h2>
                <button class="close-panel" id="closePanelBtn"><i class="fas fa-times"></i></button>
            </div>

            <!-- بخش: ارسال پیام -->
            <div class="section">
                <h3 class="sec-title">📤 ارسال پیام</h3>
                <label>مسیر مقصد</label>
                <select class="input" id="targetCat"></select>
                <label>محتوای پیام</label>
                <textarea class="input" id="msgText" placeholder="متن خود را وارد کنید..."></textarea>
                <button class="btn btn-cyber" id="sendBtn">ارسال</button>
                <p class="note" id="msgNote">✅ پیام با موفقیت ارسال شد!</p>
            </div>

            <!-- بخش: دسته‌بندی‌ها -->
            <div class="section">
                <h3 class="sec-title">📂 مدیریت شاخه‌ها</h3>
                <div id="panelCats"></div>
                <label>نام شاخه جدید</label>
                <input type="text" class="input" id="newCatName" placeholder="مثال: بازی‌های اکشن">
                <label>توضیحات</label>
                <input type="text" class="input" id="newCatDesc" placeholder="مثال: دانلود بازی‌های اکشن باکیفیت">
                <button class="btn btn-green" id="addCatBtn">ایجاد شاخه</button>
                <p class="note" id="catNote">✅ شاخه جدید ایجاد شد!</p>
            </div>
        </div>
    </div>

    <script>
        // === رمز ۳۲ رقمی شما ===
        const ADMIN_PASS = 'CECGAA0MMLOGOBYEIZXQUXKCFOJOKYFRTUJDXHRHDAOFCUXMUGXMMLGZBPSWWZGR';

        // === داده‌های اولیه ===
        let data = {
            categories: [
                { id: 1, name: 'بکاپ و آموزش', desc: 'فایل‌های پشتیبان و راهنمای نصب', messages: [] },
                { id: 2, name: 'بازی‌های PS5', desc: 'آرشیو کامل بازی‌های پلی‌استیشن ۵', messages: [] },
                { id: 3, name: 'تصاویر و والپیپر', desc: 'گالری تصاویر رسمی بازی‌ها', messages: [] }
            ]
        };

        // === ذخیره و بارگذاری دائمی ===
        function save() { localStorage.setItem('vortex_cyber', JSON.stringify(data)); }
        function load() {
            const saved = localStorage.getItem('vortex_cyber');
            if (saved) data = JSON.parse(saved);
            renderMain();
        }
        function showNote(id) {
            const el = document.getElementById(id);
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        // === صفحه اصلی ===
        function renderMain() {
            const list = document.getElementById('catsList');
            list.innerHTML = '';
            data.categories.forEach((cat, index) => {
                const card = document.createElement('div');
                card.className = 'cat-card';
                card.innerHTML = `
                    <h3 class="cat-name">${cat.name}</h3>
                    <p class="cat-desc">${cat.desc}</p>
                `;
                card.onclick = () => openPage(index);
                list.appendChild(card);
            });
            renderPanelLists();
        }

        // === صفحه پیام‌ها (مثل پیام‌رسان) ===
        function openPage(index) {
            const cat = data.categories[index];
            document.getElementById('pageTitle').textContent = cat.name;
            const box = document.getElementById('msgsBox');
            box.innerHTML = '';
            
            if (cat.messages.length === 0) {
                box.innerHTML = '<p class="empty">هنوز پیامی ارسال نشده</p>';
            } else {
                cat.messages.forEach(msg => {
                    const bubble = document.createElement('div');
                    bubble.className = 'msg-bubble';
                    bubble.textContent = msg;
                    box.appendChild(bubble);
                });
            }
            document.getElementById('msgPage').classList.add('active');
        }
        function closePage() {
            document.getElementById('msgPage').classList.remove('active');
        }

        // === لیست‌های پنل مدیریت ===
        function renderPanelLists() {
            const select = document.getElementById('targetCat');
            select.innerHTML = '';
            data.categories.forEach((cat, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = cat.name;
                select.appendChild(option);
            });

            const panelList = document.getElementById('panelCats');
            panelList.innerHTML = '';
            data.categories.forEach((cat, index) => {
                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML = `
                    <div style="font-weight:700; color:var(--cyber-cyan); margin-bottom:4px;">${cat.name}</div>
                    <div style="font-size:13px; color:var(--text-dim); margin-bottom:8px;">${cat.desc}</div>
                    <div style="font-size:12px; color:var(--cyber-pink);">تعداد پیام: ${cat.messages.length}</div>
                    <button class="btn btn-pink" data-index="${index}" style="margin-top:10px;">حذف این شاخه</button>
                `;
                panelList.appendChild(item);
            });

            // اتصال دکمه‌های حذف
            panelList.querySelectorAll('button.btn-pink').forEach(btn => {
                btn.onclick = function() {
                    if (confirm('آیا از حذف اطمینان دارید؟')) {
                        const idx = parseInt(this.getAttribute('data-index'));
                        data.categories.splice(idx, 1);
                        save(); renderMain();
                    }
                };
            });
        }

        // === ورود و خروج ===
        function openLogin() {
            document.getElementById('loginModal').classList.add('active');
            document.getElementById('passInput').value = '';
            document.getElementById('passErr').style.display = 'none';
        }
        function checkLogin() {
            if (document.getElementById('passInput').value.trim() === ADMIN_PASS) {
                document.getElementById('loginModal').classList.remove('active');
                document.getElementById('adminPanel').classList.add('active');
                renderPanelLists();
            } else {
                document.getElementById('passErr').style.display = 'block';
            }
        }
        function closePanel() {
            document.getElementById('adminPanel').classList.remove('active');
        }

        // === اتصال همه رویدادها ===
        document.addEventListener('DOMContentLoaded', () => {
            load();

            document.getElementById('openPanelBtn').onclick = openLogin;
            document.getElementById('loginBtn').onclick = checkLogin;
            document.getElementById('closePanelBtn').onclick = closePanel;
            document.getElementById('backBtn').onclick = closePage;

            // ارسال پیام
            document.getElementById('sendBtn').onclick = () => {
                const idx = parseInt(document.getElementById('targetCat').value);
                const text = document.getElementById('msgText').value.trim();
                if (!text) return alert('متن پیام را وارد کنید!');
                data.categories[idx].messages.push(text);
                document.getElementById('msgText').value = '';
                save(); renderMain();
                showNote('msgNote');
            };

            // افزودن دسته جدید
            document.getElementById('addCatBtn').onclick = () => {
                const name = document.getElementById('newCatName').value.trim();
                const desc = document.getElementById('newCatDesc').value.trim();
                if (!name) return alert('نام شاخه را بنویسید!');
                data.categories.push({
                    id: Date.now(),
                    name: name,
                    desc: desc || 'بدون توضیحات',
                    messages: []
                });
                document.getElementById('newCatName').value = '';
                document.getElementById('newCatDesc').value = '';
                save(); renderMain();
                showNote('catNote');
            };
        });
    </script>
</body>
</html>
