<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VortexPlay | وورتکس‌پلی</title>
    <!-- Tailwind CSS برای طراحی سریع و مدرن -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- کتابخانه Supabase برای ارتباط با دیتابیس -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
        .glow-effect:hover {
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.5);
            border-color: #6366f1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- هدر سایت -->
    <header class="bg-gray-900/80 backdrop-blur-md border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-500">
                <i class="fa-solid fa-gamepad ml-2"></i>VortexPlay
            </h1>
            <span class="text-xs bg-indigo-900/50 text-indigo-300 px-3 py-1 rounded-full border border-indigo-700/50">نسخه گیمینگ</span>
        </div>
    </header>

    <!-- بخش اصلی -->
    <main class="max-w-7xl mx-auto px-4 py-10 flex-grow w-full">
        <div class="text-center mb-12">
            <h2 class="text-4xl font-extrabold mb-3">مرجع ابزارها و بازی‌ها</h2>
            <p class="text-gray-400">به پلتفرم مدیریت و دانلود خوش آمدید؛ دسته‌بندی‌ها زیر از دیتابیس بارگذاری می‌شوند.</p>
        </div>

        <!-- لیست دسته‌بندی‌ها (به صورت داینامیک از Supabase پر می‌شود) -->
        <div id="categories-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- لودینگ اولیه -->
            <div class="col-span-full text-center py-10 text-gray-500">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-2"></i>
                <p>در حال بارگذاری اطلاعات از دیتابیس...</p>
            </div>
        </div>
    </main>

    <!-- فوتر -->
    <footer class="bg-gray-900 border-t border-gray-800 py-6 text-center text-gray-500 text-sm">
        <p>تمامی حقوق محفوظ است &copy; 2026 - VortexPlay</p>
    </footer>

    <!-- اسکریپت اتصال به سوپابیس و بارگذاری داده‌ها -->
    <script>
        // اطلاعات اتصال خود را اینجا وارد کنید (یا از متغیرهای محیطی بگیرید)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadCategories() {
            const grid = document.getElementById('categories-grid');
            
            try {
                const { data, error } = await _supabase.from('categories').select('*');

                if (error) throw error;

                if (!data || data.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-center py-10 text-gray-400">هیچ دسته‌بندی‌ای هنوز ثبت نشده است.</div>';
                    return;
                }

                grid.innerHTML = '';
                data.forEach(cat => {
                    const card = `
                        <a href="${cat.link || '#'}" class="bg-gray-900/60 border border-gray-800 rounded-2xl p-6 transition-all duration-300 glow-effect block group">
                            <div class="text-indigo-400 text-3xl mb-4 group-hover:scale-110 transition-transform">
                                <i class="${cat.icon || 'fa-solid fa-folder'}"></i>
                            </div>
                            <h3 class="text-xl font-bold mb-2 text-white">${cat.title || 'بدون عنوان'}</h3>
                            <p class="text-gray-400 text-sm leading-relaxed">${cat.descr || cat.description || 'توضیحی ثبت نشده است.'}</p>
                        </a>
                    `;
                    grid.innerHTML += card;
                });

            } catch (err) {
                console.error(err);
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-red-400">خطا در دریافت اطلاعات از سرور.</div>`;
            }
        }

        loadCategories();
    </script>
</body>
</html>
