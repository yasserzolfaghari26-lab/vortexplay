<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEXPLAY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(180deg, #0b061a 0%, #1a1040 50%, #050520 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* پس‌زمینه آتشین */
        .bg-orange {
            position: fixed;
            top: -20%;
            right: -20%;
            width: 80%;
            height: 60%;
            background: radial-gradient(ellipse at center, rgba(255,140,0,0.3) 0%, transparent 70%);
            filter: blur(50px);
            pointer-events: none;
        }

        .bg-blue {
            position: fixed;
            bottom: -20%;
            left: -20%;
            width: 80%;
            height: 60%;
            background: radial-gradient(ellipse at center, rgba(30,144,255,0.3) 0%, transparent 70%);
            filter: blur(50px);
            pointer-events: none;
        }

        .bg-purple {
            position: fixed;
            top: 40%;
            left: 10%;
            width: 80%;
            height: 30%;
            background: linear-gradient(90deg, transparent, rgba(138,43,226,0.2), transparent);
            filter: blur(40px);
            pointer-events: none;
        }

        /* اشکال هندسی */
        .shape {
            position: absolute;
            opacity: 0.2;
            pointer-events: none;
        }
        .tri1 { top: 12%; left: 8%; font-size: 2rem; color: #ff8c00; }
        .x1 { top: 18%; right: 12%; font-size: 1.5rem; color: #1e90ff; }
        .dot1 { bottom: 28%; left: 15%; width: 8px; height: 8px; background: #ffd700; border-radius: 50%; }
        .sq1 { bottom: 22%; right: 10%; width: 12px; height: 12px; border: 2px solid #9932cc; }

        /* کانتینر اصلی */
        .container {
            position: relative;
            z-index: 1;
            padding: 40px 20px;
            max-width: 480px;
            margin: 0 auto;
        }

        /* لوگو */
        .logo-wrap {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e90ff, #9932cc);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 0 35px rgba(30,144,255,0.5);
        }

        .logo-inner {
            width: 114px;
            height: 114px;
            border-radius: 50%;
            background: #0b061a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-title {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        .logo-sub {
            color: #6ab7ff;
            letter-spacing: 4px;
            font-size: 0.9rem;
            margin-top: 8px;
        }

        /* نوار وضعیت */
        .status-bar {
            background: rgba(0,0,0,0.5);
            border: 2px solid #1e90ff;
            border-radius: 50px;
            padding: 12px 25px;
            text-align: center;
            margin: 25px 0;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(30,144,255,0.25);
        }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff88;
            margin-right: 10px;
            box-shadow: 0 0 10px #00ff88;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* بلوک‌ها */
        .block {
            background: rgba(20,20,50,0.6);
            border-radius: 14px;
            padding: 20px 22px;
            margin-bottom: 15px;
            border-left: 4px solid;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }

        .block:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(30,144,255,0.2);
        }

        .block h3 {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .block p {
            color: #9ab8d6;
            font-size: 0.85rem;
            margin: 0;
        }

        .block-icon {
            font-size: 1.8rem;
        }

        /* پایین صفحه */
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #5566aa;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="bg-orange"></div>
    <div class="bg-blue"></div>
    <div class="bg-purple"></div>

    <div class="shape tri1"><i class="fas fa-play"></i></div>
    <div class="shape x1"><i class="fas fa-times"></i></div>
    <div class="shape dot1"></div>
    <div class="shape sq1"></div>

    <div class="container">
        <!-- لوگو -->
        <div class="logo-wrap">
            <div class="logo-circle">
                <div class="logo-inner">VP</div>
            </div>
            <h1 class="logo-title">VORTEXPLAY</h1>
            <p class="logo-sub">◆ GAMING EMPIRE ◆</p>
        </div>

        <!-- وضعیت سیستم -->
        <div class="status-bar">
            <span class="status-dot"></span>
            SYSTEM STATUS: ONLINE
        </div>

        <!-- بلوک ۱ -->
        <div class="block" style="border-color: #4169e1;">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h3>BACKUP & TUTORIALS</h3>
                    <p>Guides & System Files</p>
                </div>
                <i class="fas fa-book block-icon" style="color: #4169e1;"></i>
            </div>
        </div>

        <!-- بلوک ۲ -->
        <div class="block" style="border-color: #1e90ff;">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h3>PS5 GAME</h3>
                    <p>PlayStation 5 Games & PKGs</p>
                </div>
                <i class="fas fa-gamepad block-icon" style="color: #1e90ff;"></i>
            </div>
        </div>

        <!-- بلوک ۳ -->
        <div class="block" style="border-color: #9932cc;">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h3>GAME PHOTOS</h3>
                    <p>Wallpapers & Screenshots</p>
                </div>
                <i class="fas fa-images block-icon" style="color: #9932cc;"></i>
            </div>
        </div>

        <!-- پایین صفحه -->
        <div class="footer">
            VORTEXPLAY © 2026 — All Rights Reserved
        </div>
    </div>
</body>
</html>
