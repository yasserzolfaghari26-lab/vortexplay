<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VORTEXPLAY 🎮</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:tahoma,sans-serif}
:root{--نارنجی:#FF6B00;--آبی:#0099FF;--تیره:#050508;--خاکستری:#12121f;--قرمز:#FF4444;--سبز:#00CC66}
body{background:var(--تیره);color:#fff;min-height:100vh;padding:20px}
.container{max-width:450px;margin:0 auto}
.header{text-align:center;padding:25px 0}
h1{font-size:28px;background:linear-gradient(90deg,var(--آبی),var(--نارنجی));-webkit-background-clip:text;color:transparent}
.sub{color:#777;margin-top:8px}
.box{background:var(--خاکستری);border-radius:16px;padding:25px;border:1px solid #222;margin-top:15px}
.textarea{width:100%;padding:15px;background:#1a1a2e;border:1px solid #333;border-radius:10px;color:#fff;font-size:16px;min-height:100px;resize:none;margin:10px 0}
.textarea:focus{outline:none;border-color:var(--نارنجی)}
.btn{width:100%;padding:14px;margin-top:10px;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;transition:.2s}
.btn-اصلی{background:linear-gradient(90deg,var(--نارنجی),var(--آبی));color:#fff}
.msg{background:#1a1a2e;border-radius:10px;padding:15px;margin-top:12px;border-right:3px solid var(--نارنجی)}
.زمان{font-size:11px;color:#666;margin-top:8px}
.خالی{text-align:center;color:#555;padding:30px}
h3{color:var(--نارنجی);margin:20px 0 10px}
.وضعیت{text-align:center;margin-top:12px;font-size:14px}
.درحال{color:var(--آبی)}
.موفق{color:var(--سبز)}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎮 VORTEXPLAY</h1>
    <p class="sub">گیت‌هاب + ذخیره مشترک — دائمی ✅</p>
  </div>

  <div class="box">
    <textarea id="ورودی" class="textarea" placeholder="پیامت رو بنویس..."></textarea>
    <button class="btn btn-اصلی" onclick="ارسال()">📤 ارسال پیام</button>
    <p id="وضعیت" class="وضعیت"></p>
    
    <h3>📋 پیام‌ها</h3>
    <div id="لیست"><p class="خالی">در حال بارگذاری...</p></div>
  </div>
</div>

<script>
// ⚙ تنظیمات — از jsonbin.io بگیر
const BIN_ID = 'شناسه-باکس-تو';
const API_KEY = 'کلید-دسترسی-تو';

let پیامها = [];

async function بارگذاری() {
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
      headers: { 'X-Master-Key': API_KEY }
    });
    const data = await res.json();
    پیامها = data.record?.پیامها || [];
    نمایش();
  } catch {
    پیامها = [];
    document.getElementById('لیست').innerHTML = 
      '<p class="خالی">اولین پیام رو تو بفرست!</p>';
  }
}

function نمایش() {
  const لیست = document.getElementById('لیست');
  if (!پیامها.length) {
    لیست.innerHTML = '<p class="خالی">هنوز پیامی نیست 😊</p>';
    return;
  }
  لیست.innerHTML = پیامها.map(p => `
    <div class="msg">
      <div>${p.متن.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>
      <div class="زمان">🕐 ${new Date(p.زمان).toLocaleString('fa-IR')}</div>
    </div>
  `).join('');
}

async function ذخیره() {
  await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json',
      'X-Master-Key': API_KEY
    },
    body: JSON.stringify({ پیامها })
  });
}

async function ارسال() {
  const متن = document.getElementById('ورودی').value.trim();
  if (!متن) return;

  const وضعیت = document.getElementById('وضعیت');
  وضعیت.className = 'وضعیت درحال';
  وضعیت.textContent = 'در حال ارسال...';

  پیامها.unshift({ متن, زمان: Date.now() });
  await ذخیره();

  document.getElementById('ورودی').value = '';
  نمایش();
  
  وضعیت.className = 'وضعیت موفق';
  وضعیت.textContent = '✅ پیام فرستاده شد! همه می‌بینن';
  setTimeout(() => وضعیت.textContent = '', 3000);
}

بارگذاری();
setInterval(بارگذاری, 10000); // هر ۱۰ ثانیه بروزرسانی
</script>
</body>
</html>
