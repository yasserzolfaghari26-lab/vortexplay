<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VortexPlay - پلتفرم گیمینگ و وب‌هاستینک</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://v1.fontapi.ir/css/Vazirmatn');
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
        }
        .cyber-card {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .cyber-card:hover {
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }
        .cyber-glow {
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="border-b border-gray-800 bg-gray-900/50 backdrop-filter blur-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-gamepad text-3xl text-blue-500 animate-pulse"></i>
                <h1 class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 cyber-glow">
                    VortexPlay
                </h1>
            </div>
            <button onclick="openAdminModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center gap-2 shadow-lg shadow-blue-500/20">
                <i class="fa-solid fa-user-shield"></i>
                پنل مدیریت
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-10 w-full flex-grow">
        <div class="text-center mb-12">
            <h2 class="text-4xl font-extrabold mb-4 text-white">به پلتفرم <span class="text-blue-500">VortexPlay</span> خوش آمدید</h2>
            <p class="text-gray-400 max-w-xl mx-auto">ارائه‌دهنده سرویس‌های گیمینگ، فایل‌ها و ابزارهای بهینه‌سازی شبکه</p>
        </div>

        <!-- Dynamic Categories Grid -->
        <div id="categories-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="cyber-card p-6 rounded-2xl text-center text-gray-400 col-span-full">
                <i class="fa-solid fa-circle-notch fa-spin text-2xl text-blue-500 mb-2"></i>
                <p>در حال بارگذاری دسته‌بندی‌ها...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-800 bg-gray-900/30 py-6 text-center text-sm text-gray-500">
        <p>© 2026 VortexPlay. تمامی حقوق محفوظ است.</p>
    </footer>

    <!-- Admin Modal -->
    <div id="admin-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="cyber-card bg-gray-900 border-gray-700 rounded-2xl p-6 w-full max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-lock text-blue-500"></i>
                    ورود مدیریت
                </h3>
                <button onclick="closeAdminModal()" class="text-gray-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <form id="admin-form" onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">رمز عبور ۳۲ رقمی مدیریت:</label>
                    <input type="password" id="admin-password" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition" placeholder="رمز عبور امنیتی مدیریت">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-3 rounded-xl shadow-lg hover:opacity-90 transition">
                    تایید و ورود
                </button>
            </form>
        </div>
    </div>

    <!-- Supabase Logic -->
    <script>
        // Supabase Credentials
        const SUPABASE_URL = 'https://tnihwoqvyvsrmdsbwavg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lZxCjOpnZcQkVDwM0l4O2w_tRut0juU';

        // Initialize Supabase Client
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Fetch and Render Content
        async function fetchContent() {
            const container = document.getElementById('categories-container');
            try {
                const { data, error } = await _supabase.from('categories').select('*');
                if (error) throw error;

                if (data && data.length > 0) {
                    container.innerHTML = data.map(cat => `
                        <div class="cyber-card p-6 rounded-2xl flex flex-col justify-between">
                            <div>
                                <div class="text-blue-400 text-3xl mb-4">
                                    <i class="${cat.icon || 'fa-solid fa-folder'}"></i>
                                </div>
                                <h3 class="text-xl font-bold text-white mb-2">${cat.title}</h3>
                                <p class="text-gray-400 text-sm mb-4">${cat.description || 'توضیحاتی ثبت نشده است.'}</p>
                            </div>
                            <a href="${cat.link || '#'}" class="inline-flex justify-center items-center gap-2 bg-gray-800 hover:bg-blue-600 text-white py-2 px-4 rounded-xl text-sm font-semibold transition">
                                مشاهده بیشتر
                                <i class="fa-solid fa-arrow-left text-xs"></i>
                            </a>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = `
                        <div class="cyber-card p-8 rounded-2xl text-center text-gray-400 col-span-full">
                            <i class="fa-solid fa-box-open text-4xl mb-3 text-gray-500"></i>
                            <p>هنوز دسته‌بندی یا آیتمی ثبت نشده است.</p>
                        </div>
                    `;
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = `
                    <div class="cyber-card p-8 rounded-2xl text-center text-red-400 col-span-full border-red-500/30">
                        <i class="fa-solid fa-triangle-exclamation text-4xl mb-3"></i>
                        <p>خطا در دریافت اطلاعات از پایگاه داده.</p>
                    </div>
                `;
            }
        }

        // Modal Controls
        function openAdminModal() {
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('admin-password').value;
            if (pass.length === 32) {
                alert('رمز عبور تایید شد. خوش آمدید مدیر!');
                closeAdminModal();
            } else {
                alert('رمز عبور مدیریت باید دقیقاً ۳۲ کاراکتر باشد.');
            }
        }

        // Initial Load
        document.addEventListener('DOMContentLoaded', fetchContent);
    </script>
</body>
</html>
