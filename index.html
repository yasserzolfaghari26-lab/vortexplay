<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VortexPlay - مدیریت کامل و محتوا</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-image: url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=1920');
            --glow-color1: rgba(168, 85, 247, 0.6);
            --glow-color2: rgba(59, 130, 246, 0.6);
            --card-bg: rgba(15, 23, 42, 0.85);
            --text-color: #f8fafc;
            --accent-color: #8b5cf6;
            --border-color: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            font-family: Tahoma, 'Segoe UI', sans-serif;
            background: #090d16 var(--bg-image) center/cover no-repeat fixed;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* هاله دایره‌ای درخشان لوگو */
        .logo-glow-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-glow-wrapper::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, var(--glow-color1) 0%, var(--glow-color2) 70%, transparent 100%);
            filter: blur(25px);
            animation: pulseGlow 4s infinite alternate;
            z-index: 1;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        .logo-img {
            position: relative;
            z-index: 2;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
        }

        h1 {
            margin: 10px 0 5px;
            font-size: 2rem;
            text-shadow: 0 0 10px var(--accent-color);
        }

        .container {
            width: 100%;
            max-width: 850px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 16px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 8px;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-color);
        }

        button {
            background: linear-gradient(135deg, var(--accent-color), #4c1d95);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4);
        }

        .hidden { display: none !important; }

        .category-box {
            border-right: 4px solid var(--accent-color);
            padding: 15px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
        }

        .message-card {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 15px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .admin-toggle-btn {
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 15px;
            width: auto;
            float: left;
        }
    </style>
</head>
<body>

    <!-- دکمه باز کردن ورود مدیریت -->
    <div style="width:100%; max-width:850px;">
        <button class="admin-toggle-btn" onclick="toggleAdminLogin()">🔐 ورود به مدیریت</button>
    </div>

    <!-- هاله دایره‌ای درخشان و لوگوی سایت -->
    <div class="logo-glow-wrapper">
        <img id="siteLogo" class="logo-img" src="https://via.placeholder.com/150/8b5cf6/ffffff?text=Vortex" alt="Vortex Logo">
    </div>

    <header>
        <h1 id="siteTitle">VortexPlay</h1>
        <p id="siteSubtitle">سامانه پویای مدیریت دسته‌بندی‌ها و محتوا</p>
    </header>

    <div class="container">

        <!-- فرم ورود مدیریت (با رمز ۳۲ رقمی) -->
        <div id="adminAuthCard" class="card hidden">
            <h2>ورود به پنل مدیریت</h2>
            <p style="font-size: 0.85rem; color: #aaa;">کلید ۳۲ رقمی امنیتی مدیریت را وارد کنید:</p>
            <input type="password" id="adminKeyInput" maxlength="32" placeholder="رمز ۳۲ رقمی امنیتی">
            <button onclick="verifyAdmin()">بررسی و ورود</button>
        </div>

        <!-- پنل تنظیمات ظاهر و ارسال پیام (فقط پس از ورود نشان داده می‌شود) -->
        <div id="adminPanel" class="card hidden">
            <h2>⚙️ پنل مدیریت سایت</h2>

            <!-- بخش مدیریت ظاهر -->
            <details style="margin-bottom: 20px;">
                <summary style="cursor:pointer; font-weight:bold; color:var(--accent-color);">🎨 تغییر تصویر پس‌زمینه و لوگو</summary>
                <div style="margin-top: 15px;">
                    <label>آدرس تصویر لوگو (URL):</label>
                    <input type="url" id="logoUrlInput" placeholder="https://site.com/logo.png">

                    <label>آدرس تصویر پس‌زمینه (URL):</label>
                    <input type="url" id="bgUrlInput" placeholder="https://site.com/bg.jpg">

                    <button onclick="updateTheme()">اعمال تغییرات ظاهر</button>
                </div>
            </details>

            <!-- بخش افزودن پیام به دسته‌بندی -->
            <h3>📝 افزودن پیام جدید</h3>
            <form id="addMessageForm">
                <label>نام دسته‌بندی:</label>
                <input type="text" id="categoryName" placeholder="مثلاً: اخبار، کدهای تخفیف" required>

                <label>متن پیام:</label>
                <textarea id="messageContent" rows="3" placeholder="متن پیام..." required></textarea>

                <button type="submit">انتشار زنده پیام</button>
            </form>
        </div>

        <!-- بخش نمایش دسته‌بندی‌ها و پیام‌ها -->
        <div class="card">
            <h2>📂 دسته‌بندی‌ها و محتوا</h2>
            <div id="contentDisplay">در حال دریافت اطلاعات...</div>
        </div>

    </div>

    <script>
        // ۱. تنظیمات اتصال به Supabase (اطلاعات خودت رو بگذار)
        const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT_URL.supabase.co';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ۲. رمز عبور ۳۲ رقمی اختصاصی مدیریت
        const ADMIN_32_KEY = "12345678901234567890123456789012"; 

        function toggleAdminLogin() {
            document.getElementById('adminAuthCard').classList.toggle('hidden');
        }

        function verifyAdmin() {
            const inputKey = document.getElementById('adminKeyInput').value;
            if (inputKey === ADMIN_32_KEY) {
                alert("ورود موفقیت‌آمیز بود!");
                document.getElementById('adminAuthCard').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
            } else {
                alert("رمز عبور ۳۲ رقمی اشتباه است!");
            }
        }

        function updateTheme() {
            const logo = document.getElementById('logoUrlInput').value;
            const bg = document.getElementById('bgUrlInput').value;

            if (logo) document.getElementById('siteLogo').src = logo;
            if (bg) document.body.style.backgroundImage = `url('${bg}')`;

            alert("ظاهر سایت به‌روزرسانی شد!");
        }

        async function loadContent() {
            const container = document.getElementById('contentDisplay');
            const { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .order('id', { ascending: false });

            if (error || !data) {
                container.innerHTML = '<p style="color:#f87171;">هنوز پیامی دریافت نشده یا دیتابیس متصل نیست.</p>';
                return;
            }

            const categories = {};
            data.forEach(item => {
                if (!categories[item.category]) categories[item.category] = [];
                categories[item.category].push(item.content);
            });

            let html = '';
            for (let cat in categories) {
                html += `<div class="category-box">`;
                html += `<h3 style="color:var(--accent-color); margin-top:0;">📁 ${cat}</h3>`;
                categories[cat].forEach(msg => {
                    html += `<div class="message-card">${msg}</div>`;
                });
                html += `</div>`;
            }

            container.innerHTML = html || '<p>هیچ محتوایی وجود ندارد.</p>';
        }

        document.getElementById('addMessageForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const category = document.getElementById('categoryName').value;
            const content = document.getElementById('messageContent').value;

            const { error } = await supabaseClient
                .from('messages')
                .insert([{ category, content }]);

            if (error) {
                alert('خطا در ثبت: ' + error.message);
            } else {
                alert('پیام منتشر شد!');
                document.getElementById('addMessageForm').reset();
                loadContent();
            }
        });

        loadContent();
    </script>
</body>
</html>
